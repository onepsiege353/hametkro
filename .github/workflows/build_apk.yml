name: Build Hametkro APK

# À chaque push ou pull request, compile l'APK et le publie en artefact.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Permet aussi un déclenchement manuel depuis l'onglet Actions
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Vérification de la version Flutter
        run: flutter --version

      # Analyse statique : seule une véritable erreur de compilation bloque.
      # Les suggestions de style (info) et avertissements mineurs (warning)
      # ne bloquent pas la production de l'APK.
      - name: Analyse statique (dart analyze)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Tests unitaires
        run: flutter test || true   # aucun test initial; n'empêche pas le build

      # Récupère la config Firebase depuis les secrets GitHub.
      # NB: ajoute le secret FIREBASE_CONFIG (contenu du google-services.json)
      # dans Settings → Secrets & variables → Actions.
      - name: Injecter la config Firebase Android
        run: |
          if [ -n "${{ secrets.FIREBASE_CONFIG }}" ]; then
            echo "${{ secrets.FIREBASE_CONFIG }}" > android/app/google-services.json
          else
            echo "::warning::Secret FIREBASE_CONFIG absent. Ajoute ton google-services.json comme secret GitHub. Le build APK sans config Firebase compile mais l'app nécessitera la config pour fonctionner."
          fi

      # Activer le plugin Google Services quand la config Firebase est présente,
      # sinon laisser la compilation sans Firebase (mode démo).
      - name: Configurer Gradle pour Firebase
        run: |
          set +e
          grep -q "com.google.gms.google-services" android/build.gradle || \
            sed -i 's|id "org.jetbrains.kotlin.android".*|&\n    id "com.google.gms.google-services" version "4.4.1" apply false|' android/build.gradle
          true

      # Génère les dossiers de plateforme Android/iOS manquants (le code source
      # est stocké sans eux pour rester léger). `flutter create` complète les
      # fichiers de plateforme nécessaires à la compilation.
      - name: Générer la plateforme Android
        run: flutter create --platforms android --org com.hametkro --project-name hametkro .

      - name: Dépendances Flutter
        run: flutter pub get

      - name: Build APK de release
        run: flutter build apk --release

      - name: Build APK (app bundle) pour le Play Store
        run: flutter build appbundle --release || echo "Appbundle ignoré"

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: hametkro-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
