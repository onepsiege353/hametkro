<script>

<style>
  :root{--org:#FF7A00;--org-d:#E06A00;--grn:#009A44;--grn-d:#007A36;--ink:#17150F;--grey:#6E6A5E;--line:#E9E6DD;--bg:#F7F6F1;--white:#fff;--sang:#E6453C}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Segoe UI',Roboto,system-ui,Arial,sans-serif;background:#EFEDE6;color:var(--ink)}
  .shell{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 0 1px var(--line);position:relative}
  #app{display:flex;flex-direction:column}
  .flag{display:flex;height:4px}.flag span{flex:1}.flag span:nth-child(1){background:var(--org)}.flag span:nth-child(2){background:#fff}.flag span:nth-child(3){background:var(--grn)}
  .topbar{background:#fff;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .logo{font-weight:900;font-size:20px}.logo b{color:var(--grn)}.logo i{color:var(--org);font-style:normal}
  .logo small{display:block;color:var(--grey);font-weight:600;font-size:9.5px}
  .grow{flex:1}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--org);color:#fff;border:none;border-radius:14px;padding:13px;width:100%;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--org-d)}.btn.g{background:var(--grn)}.btn.g:hover{background:var(--grn-d)}
  .btn.ghost{background:#fff;color:var(--org);border:2px solid var(--org)}.btn.sm{padding:9px 14px;width:auto;font-size:13px;border-radius:10px}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .input{width:100%;border:1.6px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:15px;outline:none;font-family:inherit;margin:6px 0}
  .input:focus{border-color:var(--org)} label{font-size:12px;font-weight:700;color:var(--grey)}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.cardp{padding:18px}
  .row{display:flex;align-items:center;gap:8px}.center{text-align:center}.muted{color:var(--grey);font-size:12px}
  a{color:var(--org);cursor:pointer;font-weight:700;text-decoration:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px;padding:12px 12px 110px}
  .grid .tile{min-width:0}
  .tile .img{height:126px;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FCE8D6,#E5F4EA)}
  .tile .img .e{font-size:50px}.tile .img .new{position:absolute;left:8px;top:8px;background:var(--org);color:#fff;font-size:8.5px;font-weight:800;padding:3px 6px;border-radius:6px}
  .tile .bd{padding:9px}.tile .bd h4{margin:0 0 3px;font-size:13px;line-height:1.2}
  .tile .pr{color:var(--grn);font-weight:900;font-size:14.5px}
  .tile .me{margin-top:5px;display:flex;justify-content:space-between;color:var(--grey);font-size:10px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;background:#fff;border:1.6px solid var(--line);border-radius:30px;padding:7px 13px;font-size:12.5px;cursor:pointer;font-weight:600}
  .chip.on{background:var(--org);border-color:var(--org);color:#fff}
  .search{margin:2px 12px 4px;position:relative}.search .input{padding-left:38px;margin:0}.search .ic{position:absolute;left:14px;top:12px;color:var(--grey)}
  .hdr{display:flex;align-items:center;padding:10px 12px}.hdr h2{margin:0;font-size:19px}
  .nav{position:sticky;bottom:0;left:0;width:100%;max-width:460px;margin:auto;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30}
  .nav button{flex:1;border:none;background:none;padding:8px 0 10px;font-size:9px;font-weight:600;color:var(--grey);cursor:pointer;font-family:inherit}
  .nav button .i{font-size:20px;display:block}.nav button.on{color:var(--org)}.nav button.on .i{color:var(--grn)}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:12px;z-index:99;opacity:0;transition:.3s;font-size:13.5px;max-width:92%;text-align:center}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
  .sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:#fff;z-index:70;border-radius:18px 18px 0 0;padding:6px 18px 22px;max-height:92vh;overflow:auto}
  .modal{position:fixed;inset:0;z-index:60;display:none;background:#fff;max-width:460px;margin:0 auto;overflow:auto;padding-bottom:60px}
  .listItem{display:flex;gap:11px;align-items:center;padding:11px;background:#fff;border:1px solid var(--line);border-radius:13px;margin:7px 0;cursor:pointer}
  .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#FCE8D6,#E5F4EA);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
  .statbox{display:flex;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 4px;margin:9px 0}
  .statbox .st{flex:1;text-align:center}.statbox .st b{font-size:16px;display:block}.statbox .st span{font-size:9.5px;color:var(--grey)}
  .badge{display:inline-flex;align-items:center;background:var(--grn);color:#fff;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:8px}
  .catpill{display:inline-flex;align-items:center;gap:5px;border:1.6px solid var(--line);background:#fff;border-radius:30px;padding:8px 12px;font-size:12.5px;cursor:pointer;font-weight:600}
  .catpill.on{border-color:var(--grn);background:var(--grn);color:#fff}
  .step{display:flex;gap:10px;margin:8px 0}.step .dot{width:22px;height:22px;border-radius:50%;background:#e4e6e1;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .step.done .dot{background:var(--grn);color:#fff}.step.now .dot{background:var(--org);color:#fff}
  .step .body{flex:1}.step .body b{font-size:13px}.step .body p{margin:2px 0;color:var(--grey);font-size:11.5px}
  .info{background:#eaf6ef;border:1px solid #bfe5cf;color:#0a6e3c;border-radius:12px;padding:10px;font-size:12px;margin:8px 0}
  .warn{background:#fff5ea;border:1px solid #ffd9b8;color:#a3541b;border-radius:12px;padding:10px;font-size:12px;margin:8px 0}
  .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin:8px 0}
  .load{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:10px;color:var(--grey)}
  /* ===== Hero (page d'accueil) ===== */
  .hero{position:relative;background:linear-gradient(135deg,#FF7A00,#FF8f2e 55%,#009A44);color:#fff;padding:22px 16px 20px;border-radius:0 0 22px 22px;margin-bottom:2px;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-40px;top:-30px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
  .hero::before{content:"";position:absolute;right:40px;bottom:-50px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.10)}
  .hero h1{margin:0;font-size:24px;font-weight:900;line-height:1.1;position:relative}
  .hero p{margin:8px 0 0;font-size:13px;opacity:.95;position:relative}
  .hero .badges{display:flex;gap:8px;margin-top:14px;position:relative;flex-wrap:wrap}
  .hero .badge-chip{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);padding:5px 11px;border-radius:30px;font-size:11px;font-weight:700}
  .catSection{padding:4px 12px}
  .catSection h3{font-size:15px;margin:12px 2px 8px}
  .catRow{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
  .catCell{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;transition:.15s}
  .catCell:hover{transform:translateY(-2px);border-color:var(--org)}
  .catCell .e{font-size:26px}
  .catCell span{font-size:11px;font-weight:700;display:block;margin-top:4px}
  .sectionTitle{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 4px}
  .sectionTitle h3{margin:0;font-size:16px}
  .sectionTitle a{font-size:12px}
  /* rubrique "Nouveautés" mise en avant (bandeau horizontal) */
  .featureWrap{padding:6px 0 2px}
  .featured{display:flex;gap:10px;overflow-x:auto;padding:6px 14px 10px;scrollbar-width:none}
  .featured::-webkit-scrollbar{display:none}
  .fcard{flex:0 0 130px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
  .fcard.on{outline:2px solid var(--org)}
  .fcard .fimg{height:110px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FCE8D6,#E5F4EA)}
  .fcard .fimg img{width:100%;height:100%;object-fit:cover}
  .fcard .fimg .e{font-size:40px}
  .fcard .fbd{padding:8px}
  .fcard .fbd .ft{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fcard .fbd .fp{color:var(--grn);font-weight:900;font-size:13px}
  .fcard .nbadge{position:absolute;left:6px;top:6px;background:var(--org);color:#fff;font-size:8px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.3px}
  .fcard .promo{position:absolute;right:6px;top:6px;background:var(--grn);color:#fff;font-size:8px;font-weight:800;padding:2px 6px;border-radius:6px}
  /* galerie dans la fiche détail */
  .gallery{position:relative;background:#111}
  .gallery img{width:100%;max-height:300px;object-fit:contain;background:#111;display:block}
  .gallery .navbtn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.9);border:none;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .gallery .gprev{left:8px}.gallery .gnext{right:8px}
  .gallery .count{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 8px;border-radius:20px}
  .dots{display:flex;gap:6px;justify-content:center;padding:8px 0}
  .dots i{width:8px;height:8px;border-radius:50%;background:#ccc}
  .dots i.on{background:var(--org)}
  /* vignettes de photos à l'upload */
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
  .thumbWrap{position:relative;width:80px;height:80px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .thumbWrap img{width:100%;height:100%;object-fit:cover}
  .thumbWrap .rm{position:absolute;top:2px;right:2px;background:#e6453c;color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;line-height:20px}
  .addPhoto{width:80px;height:80px;border:2px dashed var(--org);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--org);background:#FFF7EF;cursor:pointer;flex-direction:column;font-size:11px}
  /* ===== Chat acheteur / vendeur ===== */
  .chatHead{display:flex;gap:10px;align-items:center;padding:11px 14px;background:#fff;border-bottom:1px solid var(--line)}
  .chatBox{height:calc(100vh - 172px);max-height:70vh;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:7px;background:var(--bg)}
  .chatItem{display:flex;gap:10px;align-items:center;padding:11px;background:#fff;border:1px solid var(--line);border-radius:13px;margin:7px 0;cursor:pointer}
  .bubble{max-width:78%;padding:9px 12px;border-radius:16px;font-size:13.5px;line-height:1.4;white-space:pre-wrap;word-break:break-word;position:relative}
  .bubble .bt{font-size:9.5px;opacity:.65;display:block;margin-top:3px;text-align:right}
  .bubble.me{background:var(--grn);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .bubble.them{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .chatInput{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--line);align-items:center}
  .chatInput .input{margin:0;border-radius:24px}
  .sendBtn{background:var(--grn);color:#fff;border:none;border-radius:50%;width:46px;height:46px;font-size:20px;cursor:pointer;flex:none}
  /* date / séparateur dans le chat */
  .daysep{text-align:center;font-size:10px;color:var(--grey);margin:8px 0 2px}
  /* petit point non-lu sur liste de conversations */
  .unreadDot{width:9px;height:9px;border-radius:50%;background:var(--sang);flex:none}
  /* ===== RESPONSIVE : écrans moyens et grands (tablette / ordinateur) ===== */
  .nav{position:sticky;bottom:0;width:100%;max-width:460px;margin:0 auto}
  .grid .tile .img{height:160px}
  @media (min-width:600px){
    .grid{padding:16px 18px 40px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
    .grid .tile .img{height:200px}
    .shell{max-width:1200px}
    .topbar{max-width:1200px}
    /* nav fixée tout en bas sur toute la largeur max du shell */
    .nav{max-width:1200px;border-radius:0}
  }
  @media (min-width:900px){
    body{background:#eceadb;padding:0}
    .shell{border-radius:0}
    /* Navigation en haut, façon application desktop */
    .nav{position:sticky;top:0;bottom:auto;border-top:none;border-bottom:1px solid var(--line);
         order:-1;max-width:1200px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-radius:0 0 12px 12px}
    .nav button{padding:12px 0 10px;font-size:10.5px;border-bottom:3px solid transparent}
    .nav button.on{border-bottom-color:var(--org)}
    .nav button.on .i{font-size:22px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
    .grid{padding-bottom:60px}
  }
  @media (min-width:1280px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  }
</style>

<body>
<div class="shell"><div class="flag"><span></span><span></span><span></span></div><div id="app"></div></div>
<div class="toast" id="toast"></div>
<div class="scrim" id="scrim" onclick="closeAll()"></div>
<div class="sheet" id="sheet"></div>
<div class="modal" id="modal"></div>

<script>
/* ============== CONSTANTES & CATALOGUES ============== */
const COMM_RATE=0.06;
const CATS=[
 {id:'phone',e:'📱',n:'Téléphones'},{id:'computer',e:'💻',n:'Ordinateurs'},
 {id:'cars',e:'🚗',n:'Voitures & Moto'},{id:'fashion',e:'👗',n:'Mode & Friperie'},
 {id:'furniture',e:'🛋️',n:'Meubles'},{id:'electronics',e:'🎧',n:'Électronique'},
 {id:'sports',e:'⚽',n:'Sport & Loisirs'},{id:'books',e:'📚',n:'Livres'}];
const CONDS=['Neuf','Comme neuf','Très bon état','Bon état','Correct','À réparer'];
function catOf(id){return CATS.find(c=>c.id===id)||CATS[3]}
function fmt(n){return Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function timeago(t){if(!t)return '';let s=(Date.now()-t)/1000;if(s<60)return 'à l\'instant';if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';return Math.floor(s/86400)+' j'}
function uidr(){return Math.random().toString(36).slice(2,9)}
function toast(m){let t=document.getElementById('toast');t.innerHTML=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,2400)}
function closeAll(){['scrim','sheet','modal'].forEach(i=>document.getElementById(i).style.display='none')}
function openSheet(h){closeAll();document.getElementById('sheet').innerHTML=h;document.getElementById('scrim').style.display='block';document.getElementById('sheet').style.display='block'}
function openModal(h){closeAll();document.getElementById('modal').innerHTML=h;document.getElementById('modal').style.display='block'}
function renderApp(h){document.getElementById('app').innerHTML=h}

/* ============== FIREBASE ============== */
let db, auth, curUser=null, curProfile=null;
// Cache des profils vendeurs (par uid) pour la page vendeur détaillée.
let sellerCache={};
async function getSeller(uid){ if(sellerCache[uid]) return sellerCache[uid];
  try{ const d=await db.collection('users').doc(uid).get(); sellerCache[uid]= d.exists?d.data():null; }
  catch(e){ sellerCache[uid]=null; } return sellerCache[uid]; }

// Notifications générées à partir des transactions de l'utilisateur (aucun
// stockage serveur nécessaire). État "lu" conservé en local par utilisateur.
let notifsCache=[];
let notifUnread=0;
function notifReadKey(uid){return 'ham_notifread_'+uid;}
function buildNotifs(uid){
  if(!uid) { notifsCache=[]; notifUnread=0; return; }
  let arr=[];
  // Notifications de transactions me concernant
  txCache.forEach(t=>{
    const meAsBuyer = t.buyerId===uid, meAsSeller = t.sellerId===uid;
    const ts=t.updatedAt||t.createdAt||Date.now();
    if(meAsSeller && t.status==='agreed' && !t.validBuyer){
      arr.push({id:t.id+'_req',icon:'🛒',title:'Nouvelle transaction',body:esc(t.buyerName)+' veut acheter « '+esc(t.itemTitle)+' » ('+fmt(t.price)+' FCFA).',time:ts,read:false});
    }
    if(meAsSeller && t.validBuyer && !t.validSeller && t.status!=='done'){
      arr.push({id:t.id+'_buyerok',icon:'✅',title:'L\'acheteur a confirmé',body:esc(t.buyerName)+' a reçu l\'article. Confirme le paiement reçu pour clôturer.',time:ts,read:false});
    }
    if(meAsBuyer && t.validSeller && !t.validBuyer && t.status!=='done'){
      arr.push({id:t.id+'_sellerok',icon:'✅',title:'Le vendeur a confirmé',body:esc(t.sellerName)+' a confirmé le paiement. Confirme la réception.',time:ts,read:false});
    }
    if(t.status==='done' && meAsSeller){
      arr.push({id:t.id+'_done',icon:'🎉',title:'Vente terminée',body:'« '+esc(t.itemTitle)+' » : commission '+fmt(t.commission)+' FCFA tracée pour Hametkro.',time:ts,read:false});
    }
    if(t.status==='dispute'){
      arr.push({id:t.id+'_disp',icon:'⚠️',title:'Litige en cours',body:'« '+esc(t.itemTitle)+' » : l\'admin va arbitrer.',time:ts,read:false});
    }
  });
  arr.sort((a,b)=>b.time-a.time);
  const readSet=new Set(JSON.parse(localStorage.getItem(notifReadKey(uid))||'[]'));
  arr.forEach(n=>{ if(readSet.has(n.id)) n.read=true; });
  notifsCache=arr.slice(0,30);
  notifUnread=arr.filter(n=>!n.read).length;
}
function markNotifsRead(){ if(!curProfile)return; const u=curProfile.uid;
  const readSet=new Set(JSON.parse(localStorage.getItem(notifReadKey(u))||'[]'));
  notifsCache.forEach(n=>readSet.add(n.id)); notifsCache.forEach(n=>n.read=true); notifUnread=0;
  localStorage.setItem(notifReadKey(u),JSON.stringify([...readSet])); }
function openNotifs(){ if(!curProfile)return openAuth(); markNotifsRead(); shell();
  openModal(`<div style="padding:14px 16px"><div class="row" style="justify-content:space-between"><b style="font-size:17px">🔔 Notifications</b><span style="cursor:pointer;font-size:20px" onclick="closeAll()">✕</span></div>
    <div style="margin-top:6px">${notifsCache.length?notifsCache.map(n=>`<div class="box" style="display:flex;gap:10px;align-items:flex-start;border-left:3px solid ${n.read?'var(--line)':'var(--org)'}"><div style="font-size:22px">${n.icon}</div><div class="grow"><b>${n.title}</b>${!n.read?' <span class="badge">nouveau</span>':''}<p class="muted" style="margin:2px 0">${n.body}</p><div class="muted" style="font-size:10px">${timeago(n.time)}</div></div></div>`).join(''):'<p class="muted center" style="padding:30px 0">Aucune notification pour le moment.</p>'}</div></div>`); }

// Charge le profil Firestore de l'utilisateur courant (ou null si non connecté).
async function refreshMe(){
  const u=auth&&auth.currentUser;
  curUser=u;
  if(!u){ curProfile=null; return; }
  try{ const d=await db.collection('users').doc(u.uid).get(); curProfile=d.exists?d.data():null; }
  catch(e){ curProfile=null; }
}
function fb(){
  firebase.initializeApp(window.HAM_FIREBASE_CONFIG);
  auth=firebase.auth(); db=firebase.firestore();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
  auth.onAuthStateChanged(async u=>{
    curUser=u;
    if(u){
      try{const d=await db.collection('users').doc(u.uid).get(); curProfile=d.exists?d.data():null;}
      catch(e){curProfile=null;}
      // Cas inscription : le doc peut être écrit juste APRÈS ce premier read.
      if(!curProfile){ await new Promise(r=>setTimeout(r,700)); try{const d=await db.collection('users').doc(u.uid).get(); curProfile=d.exists?d.data():null;}catch(e){} }
      afterAuthRebuild(u);
    } else { curProfile=null; notifsCache=[]; notifUnread=0; }
    boot();
  });
}
function isAdmin(){return curProfile&&curProfile.role==='admin'}

/* ============== ROUTAGE ============== */
let view='home', catF='all', q='', allListings=[];
function boot(){ shell(); }
function shell(){
  // Si un fil de discussion est affiché en plein écran, on ne ré-affiche pas
  // le shell à cause d'un snapshot en arrière-plan (bug de sortie du chat).
  if(chatIsOpen()) return;
  let body = view==='home'?homeV(): view==='sell'?sellV(): view==='msg'?messagesV(): view==='me'?profileV(): view==='admin'?adminV(): homeV();
  let top = curProfile? `<div class="logo grow"><b>hamet</b><i>kro</i><small>${esc(curProfile.country||"Côte d'Ivoire")} ${(curProfile.countryCode==='CI'||!curProfile.countryCode)?'🇨🇮':'🌍'} · ${esc(curProfile.city||'')}</small></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="text-align:right;font-size:11px;color:var(--grey)">${esc((curProfile.name||'Compte').split(' ')[0])} ${isAdmin()?'<span class="badge">ADMIN</span>':''}</div>
        <div style="position:relative;cursor:pointer" onclick="openNotifs()"><span style="font-size:22px">🔔</span>
          ${notifUnread>0?`<span style="position:absolute;top:-4px;right:-6px;background:var(--sang);color:#fff;font-size:9px;font-weight:800;border-radius:50%;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 3px">${notifUnread}</span>`:''}</div>
      </div>`
    : `<div class="logo grow"><b>hamet</b><i>kro</i><small>Côte d'Ivoire 🇨🇮 · navigation libre</small></div>
      <button class="btn g sm" onclick="openAuth()">Se connecter</button>`;
  let msgBadge = curProfile&&msgUnread>0?`<span style="position:absolute;top:-2px;right:calc(50% - 20px);background:var(--sang);color:#fff;font-size:9px;font-weight:800;border-radius:50%;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px">${msgUnread>99?'99+':msgUnread}</span>`:'';
  let items=[['home','🏠','Accueil'],['sell','🗂️','Vendre']];
  if(curProfile) items.push(['msg','💬','Messages']);
  items.push(['me','👤','Compte']);
  items=items.map(([k,i,l])=>`<button class="${view===k?'on':''}" onclick="view='${k}';shell()"><span class="i" style="position:relative">${i}${k==='msg'?msgBadge:''}</span>${l}</button>`).join('');
  if(isAdmin()) items+=`<button class="${view==='admin'?'on':''}" onclick="view='admin';shell()"><span class="i">📊</span>Admin</button>`;
  let installBar = deferredPrompt ? `<div style="position:fixed;left:50%;transform:translateX(-50%);bottom:64px;width:100%;max-width:460px;z-index:45;padding:6px 12px">
    <div style="background:var(--org);color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.18)">
      <span style="font-size:20px">📲</span><div class="grow" style="font-size:12.5px;font-weight:700">Installe Hametkro sur ton téléphone</div>
      <span style="background:#fff;color:var(--org);padding:6px 12px;border-radius:9px;font-weight:800;cursor:pointer" onclick="installPWA()">Installer</span>
    </div></div>` : '';
  renderApp(`<div class="topbar">${top}</div>${body}<div class="nav">${items}</div>${installBar}`);
  document.documentElement.scrollTop=0;
}

function homeV(){
  let list=allListings.filter(l=>!l.sold&&(catF==='all'||l.cat===catF)&&(!q||(l.t||'').toLowerCase().includes(q)||(l.city||'').toLowerCase().includes(q)));
  let firstName = curProfile ? (curProfile.name||'Compte').split(' ')[0] : '';
  let hero = `<div class="hero">
    <h1>${curProfile?('Bonjour '+esc(firstName)+' 👋'):'Achète & vends près de chez toi'}</h1>
    <p>${curProfile?'Découvre les bonnes affaires du marché ivoirien 🇨🇮':'Le marché de la seconde main en Côte d\'Ivoire 🇨🇮 · 100% sécurisé'}</p>
    <div class="badges"><span class="badge-chip">🔒 Achat sécurisé</span><span class="badge-chip">✅ Validation mutuelle</span><span class="badge-chip">💚 Éco-responsable</span></div>
  </div>`;
  let catSection = `<div class="catSection"><h3>Parcourir par catégorie</h3>
    <div class="catRow">${CATS.map(c=>`<div class="catCell" onclick="setCat('${c.id}')"><div class="e">${c.e}</div><span>${c.n}</span></div>`).join('')}</div></div>`;
  let searchChips = `<div class="search"><span class="ic">🔍</span><input class="input" id="q" placeholder="Rechercher un article…" value="${esc(q)}" oninput="q=this.value;shell()"></div>
    <div class="chips"><div class="chip ${catF==='all'?'on':''}" onclick="setCat('all')">Tout</div>${CATS.map(c=>`<div class="chip ${catF===c.id?'on':''}" onclick="setCat('${c.id}')">${c.e} ${c.n}</div>`).join('')}</div>`;
  // --- NOUVEAUTÉS mises en avant : annonces récentes (< 48h), bandeau scrollable
  let featured='';
  if(catF==='all' && !q){
    const fresh=allListings.filter(l=>!l.sold && (Date.now()-l.time)<48*3600*1000).sort((a,b)=>b.time-a.time);
    if(fresh.length){
      featured=`<div class="featureWrap"><div class="sectionTitle" style="padding-top:12px"><h3>🔥 Nouveautés</h3><a onclick="setCat('all')">Nouveau</a></div>
      <div class="featured">${fresh.slice(0,12).map(f=>{let im=firstImg(f);return `<div class="fcard ${f.time>(Date.now()-24*3600*1000)?'on':''}" onclick="detail('${f.id}')">
        <div class="fimg">${im?`<img src="${esc(im)}">`:`<span class="e">${catOf(f.cat).e}</span>`}</div>
        <span class="nbadge">NOUVEAU</span>${f.time>(Date.now()-24*3600*1000)?'<span class="promo">✨ 24h</span>':''}
        <div class="fbd"><div class="ft">${esc(f.t)}</div><div class="fp">${fmt(f.p)} FCFA</div></div></div>`;}).join('')}</div></div>`;
    }
  }
  let title = catF!=='all' ? `<div class="sectionTitle"><h3>${catOf(catF).e} ${catOf(catF).n}</h3><a onclick="setCat('all')">Tout voir</a></div>` : `<div class="sectionTitle"><h3>Annonces récentes</h3></div>`;
  let cards=list.length?`<div class="grid">${list.map(tile).join('')}</div>`:`<div class="center cardp muted">Aucun article pour le moment.</div>`;
  return hero+featured+catSection+searchChips+title+cards;
}
function setCat(id){catF=id;shell();}
function firstImg(l){return (l.photos&&l.photos.length)?l.photos[0]:(l.img||'');}
function tile(l){let im=firstImg(l);
  return `<div class="card tile" onclick="detail('${l.id}')">
  <div class="img">${im?`<img src="${esc(im)}" style="width:100%;height:100%;object-fit:cover">`:`<span class="e">${catOf(l.cat).e}</span>`}
    ${(l.photos&&l.photos.length>1)?`<span style="position:absolute;right:8px;top:8px;background:rgba(0,0,0,.5);color:#fff;font-size:9px;padding:2px 6px;border-radius:6px">🖼 ${l.photos.length}</span>`:''}
    <span class="new">${(Date.now()-(l.time||0))<3*864e5?'NOUVEAU':''}</span></div>
  <div class="bd"><h4>${esc(l.t)}</h4><div class="pr">${fmt(l.p)} FCFA</div>
    <div class="me"><span>📍 ${esc(l.city||'')}</span><span>${timeago(l.time)}</span></div></div></div>`;}

let galIndex={}; // état du carrousel par annonce
function galleryHtml(l,id){
  const photos=(l.photos&&l.photos.length)?l.photos:(l.img?[l.img]:[]);
  const cur=galIndex[id]||0;
  if(photos.length===0) return `<div style="height:200px;display:flex;align-items:center;justify-content:center;font-size:96px;background:linear-gradient(135deg,#FCE8D6,#E5F4EA)">${catOf(l.cat).e}</div>`;
  if(photos.length===1) return `<div class="gallery"><img src="${esc(photos[0])}"></div>`;
  let dots=photos.map((_,i)=>`<i class="${i===cur?'on':''}"></i>`).join('');
  return `<div class="gallery">
    <img src="${esc(photos[cur])}">
    ${cur>0?`<button class="navbtn gprev" onclick="galleryGo('${id}',-1)">‹</button>`:''}
    ${cur<photos.length-1?`<button class="navbtn gnext" onclick="galleryGo('${id}',1)">›</button>`:''}
    <span class="count">${cur+1}/${photos.length}</span>
  </div><div class="dots">${dots}</div>`;
}
function galleryGo(id,dir){galIndex[id]=((galIndex[id]||0)+dir+100)%100;detail(id);}

  const mine = curProfile && curProfile.uid===sid;
  const seller = await getSeller(sid);
  const sellerName = seller? seller.name : (sid==='u_demo'?'Adja Shop':'Vendeur');
  const sellerCity = seller? seller.city : 'Abidjan';
  const sellerJoined = seller? (seller.created||null) : null;
  const sellerEmail = seller? seller.email : '';
  const myItems = allListings.filter(l=>l.sellerId===sid && !l.sold);
  const soldCount = allListings.filter(l=>l.sellerId===sid && l.sold).length;
  // stats vendeur
  const asSeller = txCache.filter(t=>t.sellerId===sid && t.status==='done');
  const rating = seller && seller.rating ? seller.rating : '4.8';
  const sales = asSeller.length || soldCount;
  const joinedTxt = sellerJoined? ('Membre depuis '+new Date(sellerJoined).getFullYear()) : '';
  const head = `<div class="hero" style="border-radius:0;padding:20px 16px">
     <div style="display:flex;gap:14px;align-items:center;position:relative">
       <div style="width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid #fff">${mine?'👤':'🛍️'}</div>
       <div style="flex:1;color:#fff"><div style="font-size:20px;font-weight:900">${esc(sellerName)} ${seller&&seller.role==='admin'?'<span style="font-size:10px;background:#fff;color:var(--grn);padding:2px 7px;border-radius:8px">ADMIN</span>':''}</div>
         <div style="font-size:12px;opacity:.95">📍 ${esc(sellerCity)} · ${esc(joinedTxt)}</div>
         <div style="font-size:12px;margin-top:6px">${esc(sellerEmail?sellerEmail:'Vendeur vérifié par Hametkro')}</div></div>
     </div>
     <div style="display:flex;gap:10px;margin-top:14px;position:relative">
       <div class="badge-chip">⭐ ${rating} note</div><div class="badge-chip">✅ ${sales} vente${sales>1?'s':''}</div><div class="badge-chip">🛒 ${myItems.length} en vente</div>
     </div>
   </div>`;
  const sellerItems = myItems.length ? `<div style="padding:6px 12px"><h3 style="margin:12px 2px 8px">Ses annonces</h3><div class="grid" style="padding-top:4px">${myItems.map(tile).join('')}</div></div>` : '<p class="muted center" style="padding:30px">Ce vendeur n\'a pas d\'article en vente actuellement.</p>';

  if(mine){ actions=`<div style="padding:4px 14px"><button class="btn ghost" onclick="view='me';shell()">C\'est ton profil</button></div>`; }
  renderApp(`<div class="topbar"><div class="logo grow"><b>hamet</b><i>kro</i></div><button class="btn g sm" onclick="view='home';shell()">← Accueil</button></div>${head}${sellerItems}${actions}<div style="height:30px"></div>`);
  document.documentElement.scrollTop=0;
}

 let mine=curProfile&&l.sellerId===curProfile.uid;
 let img=galleryHtml(l,id);
 openModal(`<div style="position:sticky;top:0;background:#fff;padding:10px 14px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)"><span>${catOf(l.cat).e} ${catOf(l.cat).n}</span><span style="cursor:pointer;font-size:20px" onclick="closeAll()">✕</span></div>

  <div class="box"><b>Description</b><p class="muted" style="margin:5px 0;font-size:13px">${esc(l.d||"Vendeur de confiance. Remise en main propre, paiement à la réception — jamais d'avance.")}</p></div>

  ${mine?'<div class="info">C\'est ton article.</div>':
    `<div class="row" style="gap:8px;margin-top:8px">
      <button class="btn g" style="flex:1" onclick="curUser?openChatFromListing('${l.id}'):openAuth('sell')">💬 Discuter</button>
      <button class="btn ghost" style="flex:1" onclick="shareListing('${l.id}')">📤 Partager</button></div>
     <button class="btn ghost" style="margin-top:8px" onclick="curUser?startContact('${l.id}'):openAuth('sell')">🛡️ Lancer une transaction sécurisée</button>
     <div class="info" style="text-align:center">🔒 Achat sécurisé : validation mutuelle. Commission ${Math.round(COMM_RATE*100)}%.</div>`}
  </div>`);}

function waUrl(id){const l=allListings.find(x=>x.id===id);if(!l)return'';const url=listingURL(id);
  const txt=`${l.t} - ${fmt(l.p)} FCFA (${l.cond||''}), ${l.city||'Abidjan'}, Côte d'Ivoire 🇨🇮\n\nVoir l'annonce sur Hametkro : ${url}\n\n🔒 Achat sécurisé, ne paie jamais d'avance.`;
  return 'https://wa.me/?text='+encodeURIComponent(txt);}
function shareListing(id){const l=allListings.find(x=>x.id===id);if(!l)return;
  openSheet(`<div class="row" style="justify-content:space-between;padding:12px 0"><b>📤 Partager l'annonce</b><span style="cursor:pointer;font-size:20px" onclick="closeAll()">✕</span></div>

/* ============== AUTH ============== */
function openAuth(){openModal(`<div class="cardp">
  <div style="display:flex;justify-content:space-between"><b style="font-size:18px">Connexion / Inscription</b><span style="cursor:pointer;font-size:20px" onclick="closeAll()">✕</span></div>
  <div class="info">La navigation et la consultation sont libres. Un compte est requis pour <b>vendre</b> ou <b>contacter</b>.</div>
  <button class="btn g" onclick="openAuthForm(false)">Créer un compte</button>
  <div style="height:8px"></div><button class="btn ghost" onclick="openAuthForm(true)">Se connecter</button></div>`);}
function openAuthForm(login){openModal(`<div class="cardp"><b style="font-size:18px">${login?'Connexion':'Créer mon compte'}</b>
 ${login?`<label>Email</label><input id="le" class="input" type="email"><label>Mot de passe</label><input id="lp" class="input" type="password"><button class="btn g" onclick="doLogin()">Se connecter</button>`
 :`<label>Nom complet</label><input id="rn" class="input"><label>Email</label><input id="re" class="input" type="email"><label>Ville</label><input id="rc" class="input" value="Abidjan"><label>Mot de passe (min 6)</label><input id="rp" class="input" type="password"><button class="btn g" onclick="doRegister()">Créer mon compte</button>`}
 <p class="muted center">← <a onclick="openAuth()">retour</a></p></div>`);}
function val(id){let x=document.getElementById(id);return x?x.value:''}
async function doLogin(){let e=val('le'),p=val('lp');if(!e||!p)return toast('Remplis les champs');
 try{
  await auth.signInWithEmailAndPassword(e,p);
  await refreshMe(); // garantit le chargement du profil avant l'affichage
  toast('Bienvenue 👋');closeAll();view='home';shell();
 }
 catch(err){toast('❌ '+(err.code==='auth/user-not-found'||err.code==='auth/wrong-password'?'Email ou mot de passe incorrect':(err.code==='auth/user-disabled'?'Compte désactivé':err.code)));}}
async function doRegister(){let n=val('rn'),e=val('re'),p=val('rp'),city=val('rc')||'Abidjan';
 if(n.length<2)return toast('Entre ton nom');if(!/^\S+@\S+\.\S+$/.test(e))return toast('Email invalide');if(p.length<6)return toast('Mot de passe min 6');
 try{
  const cred=await auth.createUserWithEmailAndPassword(e,p);const uid=cred.user.uid;
  // 1er compte sur projet vide => admin (paramétrage initial)
  let isFirst=false;try{let c=await db.collection('users').get();isFirst=(c.size===0);}catch(_){}
  await db.collection('users').doc(uid).set({uid,name:n,email:e.toLowerCase(),city,country:"Côte d'Ivoire",countryCode:'CI',created:Date.now(),role:isFirst?'admin':'member'});
  await refreshMe(); // recharge le profil DÈS que le doc existe (évite de rester sur la page de connexion)
  toast(isFirst?'🎉 Compte créé — tu es ADMIN (1er utilisateur)':'🎉 Compte créé');closeAll();view='home';shell();
 }catch(err){toast('❌ '+(err.code==='auth/email-already-in-use'?'Cet email existe déjà':err.code));}}

  <label>État</label><div class="row" style="gap:6px;flex-wrap:wrap">${CONDS.map(c=>`<span class="catpill" data-c="${c}" onclick="pickCond(this)">${c}</span>`).join('')}</div><input type="hidden" id="${pid}_cond" value="Bon état">
  <label>Description</label><textarea id="${pid}_d" class="input" rows="3"></textarea>
  <button class="btn g" onclick="publish('${pid}')">Publier 🎉</button>`);
 curSheetId=pid;}
let curSheetId=null, pendingPhotos=[]; // {pid: [dataUrl...]}
function pickCat(el){el.closest('.row').querySelectorAll('.catpill').forEach(x=>x.classList.remove('on'));el.classList.add('on');document.getElementById(curSheetId+'_cat').value=el.dataset.cat}
function pickCond(el){el.closest('.row').querySelectorAll('.catpill').forEach(x=>x.classList.remove('on'));el.classList.add('on');document.getElementById(curSheetId+'_cond').value=el.dataset.c}
// Compression d'une image fichier → dataURL (petit, pour rester sous la limite Firestore)
function compressFile(file,maxSize){return new Promise((res)=>{let r=new FileReader();r.onload=()=>{let img=new Image();img.onload=()=>{let m=Math.min(1,maxSize/Math.max(img.width,img.height));let cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*m));cv.height=Math.max(1,Math.round(img.height*m));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.68));};img.src=r.result};r.readAsDataURL(file);});}
function addPhotos(pid,input){pendingPhotos[pid]=pendingPhotos[pid]||[];let files=[...input.files];input.value='';
 let run=async()=>{for(const f of files){if(pendingPhotos[pid].length>=5)break;let d=await compressFile(f,600);pendingPhotos[pid].push(d);}renderThumbs(pid);};
 run();}
function renderThumbs(pid){let arr=pendingPhotos[pid]||[];let box=document.getElementById(pid+'_th');if(!box)return;
 box.innerHTML=arr.map((d,i)=>`<div class="thumbWrap"><img src="${esc(d)}"><button class="rm" onclick="rmPhoto('${pid}',${i})">✕</button></div>`).join('')
   +(arr.length<5?`<div class="addPhoto" onclick="document.getElementById('${pid}_file').click()">📷<br>Ajouter</div>`:'');}
function rmPhoto(pid,i){pendingPhotos[pid].splice(i,1);renderThumbs(pid);}
async function publish(pid){let t=val(pid+'_t').trim(),p=parseFloat(val(pid+'_p')),city=val(pid+'_c')||'Abidjan',d=val(pid+'_d');if(t.length<3)return toast('Titre requis');if(!p||p>0===false||!p)return toast('Prix invalide');
 let photos=pendingPhotos[pid]||[];if(photos.length===0)return toast('Ajoute au moins une photo');
 try{
 let doc=db.collection('listings').doc();let now=Date.now();
 await doc.set({id:doc.id,cat:document.getElementById(pid+'_cat').value,t,p,city,cond:document.getElementById(pid+'_cond').value,size:'',d,photos,sellerId:curProfile.uid,sellerName:curProfile.name,sold:false,time:now,createdAt:now,views:0});
 closeAll();delete pendingPhotos[pid];toast('🎉 Publié !');view='sell';shell();}catch(e){toast('❌ Erreur: '+e.message)}}

/* ============== MESSAGERIE (chat acheteur/vendeur) ============== */
// Le chat est stocké dans la collection `conversations`. Les messages vivent
// dans le champ `msgs` du document (tableau). Respecte les règles Firestore
// publiées : la lecture/écriture d'une conversation est réservée à ses 2
// participants (champ `participantIds`).
// `_activeCid` != null signale qu'un fil de discussion est affiché en plein
// écran : tous les snapshots "globaux" (listings, transactions, conversations)
// DOIVENT alors ignorer leur ré-affichage pour ne pas éjecter l'utilisateur du
// chat (bug corrigé).
let convCache=[], msgUnread=0, chatUnsub=null, _activeCid=null, _convData=null;
function convIdKey(a,b,item){return [a,b].sort().join('__')+'__'+item;}
function otherName(c){ return curProfile && (c.participants||[]).find(p=>p.uid!==curProfile.uid); }
function mySeen(c){return c&&c.seen&&curProfile ? (c.seen[curProfile.uid]||0):0;}
function unreadOf(c){ if(!curProfile)return 0; const s=mySeen(c); return ((c.msgs||[]).filter(m=>m.uid!==curProfile.uid&&m.time>s)).length; }
function chatIsOpen(){return !!_activeCid;}
// Charge mes conversations (temps réel) une fois connecté.
function listenConvs(){ auth.onAuthStateChanged(u=>{ if(chatUnsub)chatUnsub(); chatUnsub=null; convCache=[]; msgUnread=0; _activeCid=null;
  if(!u){ if(view==='msg'||view==='home')boot(); return; }
  chatUnsub=db.collection('conversations').where('participantIds','array-contains',u.uid).onSnapshot(snap=>{
    convCache=snap.docs.map(d=>d.data());
    msgUnread=convCache.reduce((s,c)=>s+unreadOf(c),0);
    if(!chatIsOpen() && (view==='msg'||view==='home'))boot();
  }); }); }
// Liste mes conversations (onglet Messages)
function messagesV(){ if(!curProfile) return `<div class="hdr"><h2>Messages</h2></div><div class="center cardp" style="padding:60px 24px"><div style="font-size:60px">💬</div><h2>Ta messagerie</h2><p class="muted">Connecte-toi pour discuter avec les vendeurs.</p><button class="btn g" onclick="openAuth()">Créer un compte / se connecter</button></div>`;
  if(!convCache.length) return `<div class="hdr"><h2>Messages</h2></div><div class="center cardp" style="padding:60px 24px"><div style="font-size:56px">💬</div><h2>Aucune discussion</h2><p class="muted">Ouvre une annonce et clique « Discuter » avec le vendeur.</p><button class="btn g" onclick="view='home';shell()">Parcourir les annonces</button></div>`;
  const sorted=convCache.slice().sort((a,b)=>(b.lastAt||0)-(a.lastAt||0));
  return `<div class="hdr"><h2>Messages</h2>${msgUnread?`<span class="badge" style="background:var(--sang);margin-left:8px">${msgUnread} non-lus</span>`:''}</div>
   <div style="padding:4px 12px 40px">${sorted.map(c=>{const o=otherName(c);const u=unreadOf(c);
     const last=(c.msgs&&c.msgs.length)?c.msgs[c.msgs.length-1]:null;
     return `<div class="chatItem" onclick="openConv('${c.id}')">
      <div class="av" style="background:linear-gradient(135deg,#FCE8D6,#E5F4EA)">🛍️</div>
      <div class="grow"><div style="display:flex;justify-content:space-between;align-items:center">
        <b style="font-size:14px">${esc(o?o.name:'Vendeur')}</b><span class="muted" style="font-size:10px">${timeago(c.lastAt)}</span></div>
        <div style="font-size:12px;color:var(--grn);font-weight:600">${esc(c.itemTitle||'')}</div>
        <div style="display:flex;justify-content:space-between;align-items:center"><span class="muted" style="font-size:12px">${esc(last?(last.uid===curProfile.uid?'Vous : ':'')+last.text:'Nouvelle discussion')}</span>
        ${u?`<span style="background:var(--org);color:#fff;font-size:9px;font-weight:800;border-radius:50%;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 3px">${u}</span>`:''}</div></div>
      </div>`;}).join('')}</div>`; }
// Ouvre / crée une conversation avec le vendeur d'une annonce.
async function openChatFromListing(id){ if(!curProfile) return openAuth();
  const l=allListings.find(x=>x.id===id); if(!l) return;
  if(l.sellerId===curProfile.uid) return toast('C\'est ton propre article');
  const other=l.sellerId, otherNm=l.sellerName||'Vendeur';
  const cid=convIdKey(curProfile.uid,other,id);
  const ref=db.collection('conversations').doc(cid);
  try{
    const d=await ref.get();
    if(!d.exists){
      await ref.set({id:cid,participantIds:[curProfile.uid,other].sort(),
        participants:[{uid:curProfile.uid,name:curProfile.name},{uid:other,name:otherNm}],
        itemId:id,itemTitle:l.t,msgs:[],lastAt:Date.now(),seen:{},createdAt:Date.now()});
    }
    await openConv(cid);
  }catch(e){ toast('❌ Impossible d\'ouvrir la discussion'); }
}
// Marque "lu" pour l'utilisateur courant (pas de mise à jour inutile).
function convMarkSeen(cid,data){ if(!curProfile)return; const seen=(data&&data.seen)?data.seen:{}; seen[curProfile.uid]=Date.now();
  db.collection('conversations').doc(cid).update({seen}).catch(()=>{}); }
function convBubbles(c){ const me=curProfile?curProfile.uid:null; const msgs=(c&&c.msgs)||[];
  if(!msgs.length) return `<p class="muted center" style="padding:30px 0">Dites bonjour 👋</p>`;
  let lastDay=''; let out='';
  msgs.forEach(m=>{ const day=new Date(m.time).toDateString();
    if(day!==lastDay){ out+=`<div class="daysep">${new Date(m.time).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>`; lastDay=day; }
    const mine=m.uid===me;
    out+=`<div class="bubble ${mine?'me':'them'}">${esc(m.text)}<span class="bt">${mine?'vous':esc(m.name||'')} · ${timeago(m.time)}</span></div>`; });
  return out; }
// Ouverture : affiche l'écran de chat une fois, puis met à jour UNIQUEMENT la
// zone des bulles (on ne re-rend jamais le champ de saisie => pas de perte).
async function openConv(cid){ if(!curProfile) return openAuth();
  const ref=db.collection('conversations').doc(cid);
  const d=await ref.get(); if(!d.exists) return;
  _convData=d.data(); _activeCid=cid; _convRef=ref;
  convMarkSeen(cid,_convData);
  const o=otherName(_convData); const name=esc(o?o.name:'Vendeur');
  renderApp(`<div class="chatHead"><button class="btn ghost sm" onclick="closeConv()">←</button>
    <div class="grow"><b>${name}</b><div class="muted" style="font-size:11px">🛍️ ${esc(_convData.itemTitle||'')}</div></div>
    <span class="badge">Vérifié</span></div>
    <div class="chatBox" id="convSc">${convBubbles(_convData)}</div>
    <div class="chatInput"><input id="msgText" class="input" autocomplete="off" placeholder="Écris un message…" onkeydown="if(event.key==='Enter'){sendMsg();event.preventDefault();}">
    <button class="sendBtn" onclick="sendMsg()">➤</button></div>`);
  scrollConv();
  if(chatUnsub)chatUnsub();
  chatUnsub=ref.onSnapshot(snap=>{ if(!snap.exists)return; const prev=_convData; _convData=snap.data();
    const wasAtBottom=convAtBottom();
    const sc=document.getElementById('convSc'); if(sc) sc.innerHTML=convBubbles(_convData);
    if(convAtBottom()===false && (prev&&(_convData.msgs||[]).length>(prev.msgs||[]).length)) { /* message entrant en bas de page */ }
    if(wasAtBottom||prev==null) scrollConv();
    convMarkSeen(cid,_convData); });
}
let _convRef=null;
function convScroller(){return document.getElementById('convSc');}
function convAtBottom(){ const b=convScroller(); if(!b)return true; return b.scrollHeight-b.scrollTop-b.clientHeight<40; }
function scrollConv(){ setTimeout(()=>{const b=convScroller(); if(b)b.scrollTop=b.scrollHeight;},20); }
function closeConv(){ if(chatUnsub)chatUnsub(); chatUnsub=null; _activeCid=null; _convData=null; _convRef=null; view='msg';shell(); }
async function sendMsg(){ const inp=document.getElementById('msgText'); const txt=inp?inp.value.trim():'';
  if(!txt||!_activeCid) return;
  if(inp) inp.value='';
  const msg={uid:curProfile.uid,name:curProfile.name,text:txt,time:Date.now()};
  try{
    // Ajout ATOMIQUE côté serveur (arrayUnion) : évite la perte de messages en
    // cas d'envoi simultané par les deux interlocuteurs (bug corrigé).
    const fv=firebase.firestore.FieldValue;
    await _convRef.update({msgs:fv.arrayUnion(msg),lastAt:Date.now(),lastMsg:txt});
  }catch(e){ toast('❌ Envoi impossible'); if(inp)inp.value=txt; }
}
/* ============== TRANSACTION SÉCURISÉE ============== */
function startContact(id){let l=allListings.find(x=>x.id===id);if(!l)return;
 openSheet(`<div class="row" style="justify-content:space-between;padding:12px 0"><b>Contacter ${esc(l.sellerName)}</b><span style="cursor:pointer;font-size:20px" onclick="closeAll()">✕</span></div>
  <div class="info">Transaction <b>sécurisée</b> : validation mutuelle acheteur + vendeur, commission ${Math.round(COMM_RATE*100)}% tracée.</div>
  <label>Prix convenu (FCFA) *</label><input id="ag_p" class="input" type="number" value="${l.p}">
  <label>Mode de remise</label>
  <div class="row" style="gap:8px;margin:8px 0">
   <div class="card grow" style="cursor:pointer;padding:10px;text-align:center;border:2px solid var(--org)" onclick="pickMode('hand',this)"><div style="font-size:24px">🤝</div><b>Main propre</b><div class="muted">Lieu public</div></div>
   <div class="card grow" style="cursor:pointer;padding:10px;text-align:center" onclick="pickMode('delivery',this)"><div style="font-size:24px">📦</div><b>Livraison</b><div class="muted">Coursier / relais</div></div></div>
  <input type="hidden" id="ag_mode" value="hand">
  <div id="ag_note" class="info">📍 Remettez l'article en lieu public sécurisé. Paie à la réception, jamais d'avance.</div>
  <button class="btn g" onclick="createTx('${id}')">Lancer la transaction sécurisée</button>`);}
function pickMode(m,el){el.closest('.row').querySelectorAll('.card').forEach(x=>x.style.border='2px solid var(--line)');el.style.border='2px solid var(--org)';document.getElementById('ag_mode').value=m;document.getElementById('ag_note').innerHTML=m==='hand'?'📍 Remise en lieu public sécurisé. Paie à la réception.':'📦 Suivi livraison / point relais. L\'acheteur confirme la réception.'}
async function createTx(id){let l=allListings.find(x=>x.id===id);let p=parseFloat(val('ag_p'));if(!p||p<=0)return toast('Prix invalide');
 let doc=db.collection('transactions').doc();let now=Date.now();
 await doc.set({id:doc.id,itemId:id,itemTitle:l.t,buyerId:curProfile.uid,buyerName:curProfile.name,sellerId:l.sellerId,sellerName:l.sellerName,participants:[curProfile.uid,l.sellerId],mode:document.getElementById('ag_mode').value,price:p,status:'agreed',validBuyer:false,validSeller:false,commission:Math.round(p*COMM_RATE),createdAt:now,updatedAt:now});
 closeAll();toast('✅ Transaction sécurisée lancée');view='sell';shell();}
function txCard(t){let u=curProfile;let isBuyer=t.buyerId===u.uid;let isSeller=t.sellerId===u.uid;
 let steps=[['agreed','Accord prix','Convenu à '+fmt(t.price)+' FCFA'],['meet','Remise / réception',t.mode==='hand'?'En main propre (lieu public)':'Livraison'],['buyer_ok','L\'acheteur valide la réception',isBuyer?'À toi de confirmer':'En attente de '+esc(t.buyerName)],['seller_ok','Le vendeur valide le paiement',isSeller?'À toi de confirmer':'En attente de '+esc(t.sellerName)],['done','Clôturée','Commission '+fmt(t.commission)+' FCFA ('+Math.round(COMM_RATE*100)+'%) tracée']];
 let idx=t.status==='done'?4:(t.validBuyer?3:(t.status==='meet'||t.validSeller?2:1));
 let h='';steps.forEach((s,i)=>{let st=i<idx?'done':(i===idx?'now':'todo');h+=`<div class="step ${st}"><div class="dot">${st==='done'?'✓':(st==='now'?'●':i+1)}</div><div class="body"><b>${s[1]}</b><p>${s[2]}</p></div></div>`;});
 let act='';
 if(t.status!=='done'&&t.status!=='dispute'){
   if(isBuyer&&!t.validBuyer)act=`<button class="btn g sm" onclick="confirmTx('${t.id}','buyer')">Je confirme avoir reçu l'article</button>`;
   else if(isSeller&&!t.validSeller)act=`<button class="btn g sm" onclick="confirmTx('${t.id}','seller')">Je confirme le paiement reçu</button>`;
 }
 if(t.status==='done')act=`<div class="info">✅ Terminée — commission ${fmt(t.commission)} FCFA.</div>`;
 if(t.status==='dispute')act=`<div class="warn">⚠️ Litige — l'admin va arbitrer.</div>`;
 return `<div class="box" style="border-left:4px solid var(--grn)"><div class="row"><b class="grow">${esc(t.itemTitle)}</b><span class="muted">${fmt(t.price)} FCFA</span></div>
  <div class="muted">${isBuyer?'Tu es acheteur':'Tu es vendeur'} · ${t.mode==='hand'?'🤝 main propre':'📦 livraison'}</div>${h}${act}</div>`;}
async function confirmTx(id,who){let ref=db.collection('transactions').doc(id);let d=await ref.get();let t=d.data();
 if(who==='buyer')t.validBuyer=true;else t.validSeller=true;
 if(t.validBuyer&&t.validSeller)t.status='done';
 await ref.update({validBuyer:t.validBuyer,validSeller:t.validSeller,status:t.status,updatedAt:Date.now()});
 closeAll();if(t.status==='done'){toast('🎉 Transaction terminée !');}else{toast('Validation enregistrée ✅');}
 view='sell';shell();}

/* ============== PROFIL / ADMIN ============== */
function profileV(){if(!curProfile)return `<div class="center cardp" style="padding:60px 24px"><div style="font-size:60px">👤</div><h2>Espace membre</h2><p class="muted">Connecte-toi pour vendre et gérer tes transactions.</p><button class="btn g" onclick="openAuth()">Créer un compte / se connecter</button></div>`;
 return `<div class="hdr"><h2>Mon compte</h2></div><div style="padding:4px 12px">
  <div class="listItem"><div class="av">${esc((curProfile.name||'?')[0])}</div><div class="grow"><b>${esc(curProfile.name)} ${isAdmin()?'<span class="badge">ADMIN</span>':''}</b><br><span class="muted">${esc(curProfile.email)}</span></div><span class="badge">Vérifié</span></div>
  <div class="box"><b>📍 Marché</b><p class="muted">${esc(curProfile.country||'')} · ${esc(curProfile.city||'')}</p></div>
  <button class="btn ghost" onclick="logout()">Se déconnecter</button></div>`;}
async function logout(){try{await auth.signOut();}catch(_){}view='home';shell();}
function adminV(){if(!isAdmin())return profileV();
 let done=txCache.filter(t=>t.status==='done');let comm=done.reduce((a,t)=>a+(t.commission||0),0);let disp=txCache.filter(t=>t.status==='dispute');
 return `<div class="hdr"><h2>Admin 📊</h2></div><div style="padding:4px 12px">
  <div class="statbox"><div class="st"><b>${done.length}</b><span>ventes clôturées</span></div><div class="st"><b style="color:var(--grn)">${fmt(comm)}</b><span>FCFA commission</span></div><div class="st"><b>${disp.length}</b><span>litiges</span></div></div>
  ${disp.length?`<div class="warn"><b>⚠️ Litiges à arbitrer</b>${disp.map(d=>`<div class="box"><b>${esc(d.itemTitle)}</b> · ${fmt(d.price)} FCFA<br><span class="muted">${esc(d.buyerName)} ↔ ${esc(d.sellerName)}</span><br><button class="btn sm g" onclick="resolve('${d.id}')">Clôturer (résolu)</button></div>`).join('')}</div>`:''}
  <h3 style="margin:12px 0 4px">Revenus (commissions ${Math.round(COMM_RATE*100)}%)</h3>
  ${done.length?done.map(t=>`<div class="box" style="display:flex;justify-content:space-between"><div><b>${esc(t.itemTitle)}</b><div class="muted">${esc(t.buyerName)} → ${esc(t.sellerName)}</div></div><div style="text-align:right"><div class="green" style="color:var(--grn);font-weight:800">+${fmt(t.commission)} FCFA</div><div class="muted">${timeago(t.createdAt)}</div></div></div>`).join(''):'<p class="muted">Aucune vente clôturée.</p>'}
  </div>`;}
async function resolve(id){let ref=db.collection('transactions').doc(id);let d=await ref.get();let t=d.data();t.status='done';await ref.update({status:'done',updatedAt:Date.now()});view='admin';shell();toast('Litige clôturé ✅');}

/* ============== ÉCOUTE DES DONNÉES (Firestore temps réel) ============== */
let txCache=[], _deepDone=false;
function listenListings(){db.collection('listings').orderBy('time','desc').onSnapshot(snap=>{allListings=snap.docs.map(d=>d.data());if(!chatIsOpen())boot();if(!_deepDone){_deepDone=true;setTimeout(openListingFromURL,200);}},err=>{renderApp(`<div class="load"><div style="font-size:46px">⚠️</div><div>Impossible de lire les annonces.<br><span class="muted">Vérifie que Firestore est activé et les règles publiées.</span></div><div>${esc(err&&err.message||'')}</div></div>`);});}
function listenTx(){auth.onAuthStateChanged(u=>{ if(!u){txCache=[];notifsCache=[];notifUnread=0;return;}
  db.collection('transactions').where('participants','array-contains',u.uid).onSnapshot(snap=>{txCache=snap.docs.map(d=>d.data());buildNotifs(u.uid);if(!chatIsOpen()&&(view==='sell'||view==='admin'||view==='home'))boot();}); });}
// Reconstruit aussi les notifs au chargement initial d'un utilisateur connecté.
function afterAuthRebuild(u){ if(u) setTimeout(()=>buildNotifs(u.uid),400); }

/* ============== INSTALLATION PWA ============== */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;});
async function installPWA(){ if(!deferredPrompt)return; deferredPrompt.prompt(); const c=await deferredPrompt.userChoice; deferredPrompt=null; toast('Merci ! Hametkro est installé 📲'); }

/* ============== DÉMARRAGE ============== */
try{ fb(); listenListings(); listenTx(); listenConvs(); }catch(e){ renderApp(`<div class="load"><div style="font-size:46px">⚠️</div><div>Erreur d'initialisation Firebase.</div><div class="muted">Ouvre cette page via le serveur (http), pas en fichier local, et vérifie firebase-config.js.</div></div>`);}
