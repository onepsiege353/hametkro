<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<style>
  :root{
    --org:#F07A1E; --org-d:#DE6B0C; --org-soft:#FFF1E2;
    --grn:#0E7A44; --grn-d:#0A5E34; --grn-soft:#E7F4EC;
    --ink:#14261E; --grey:#718071; --grey2:#98A396;
    --line:#E8EAE3; --line2:#DBDFD6;
    --bg:#F5F4EF; --paper:#FCFBF7;
    --white:#fff; --sang:#E6453C; --gold:#E6A700;
    --r:17px; --rs:12px;
    --sh:0 14px 34px -18px rgba(15,60,40,.22);
    --sh-s:0 6px 16px -10px rgba(15,60,40,.16);
    --ring:0 0 0 4px rgba(14,122,68,.15);
    --font:'Sora','Segoe UI',system-ui,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:var(--font);background:linear-gradient(180deg,#EAF0EA,#E2E9E4);color:var(--ink);letter-spacing:.1px}
  .shell{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--paper);position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.03),0 0 60px rgba(30,80,50,.06);padding-bottom:84px}
  #app{display:flex;flex-direction:column}
  .flag{display:flex;height:3.5px;border-radius:999px;overflow:hidden;margin:0 14px}
  .flag span{flex:1}.flag span:nth-child(1){background:#F0701E}.flag span:nth-child(2){background:#fff}.flag span:nth-child(3){background:var(--grn)}
  .topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .logo{display:flex;align-items:center;gap:9px;min-width:0}
  .logo .mark{flex:none;display:flex}
  .logo .words{display:flex;flex-direction:column;line-height:1}
  .logo .word{font-weight:800;font-size:18px;letter-spacing:-.4px;color:var(--ink)}
  .logo .word b{color:var(--grn)}
  .logo .word i{color:var(--org);font-style:normal}
  .logo small{color:var(--grey2);font-weight:500;font-size:8.5px;margin-top:2px;letter-spacing:.2px}
  .grow{flex:1}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#FB8B24,#F07A1E 60%,var(--org-d));color:#fff;border:none;border-radius:14px;padding:14px 16px;width:100%;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 10px 22px -10px rgba(240,122,30,.65);transition:transform .12s,box-shadow .2s,filter .2s;position:relative}
  .btn:active{transform:translateY(1px) scale(.995)}
  .btn:hover{filter:brightness(1.04)}
  .btn.g{background:linear-gradient(135deg,#129452,#0E7A44 55%,var(--grn-d));box-shadow:0 10px 22px -10px rgba(14,122,68,.6)}
  .btn.ghost{background:#fff;color:var(--grn);border:1.5px solid #CBE3D3;box-shadow:none}
  .btn.ghost:hover{background:var(--grn-soft);filter:none}
  .btn.sm{padding:9px 15px;width:auto;font-size:12.5px;border-radius:11px}
  .btn.gold{background:linear-gradient(135deg,#F2B33D,var(--gold));box-shadow:0 10px 20px -10px rgba(230,167,0,.6)}
  .btn:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.2)}
  .input{width:100%;border:1.5px solid var(--line2);background:#fff;border-radius:13px;padding:13px 15px;font-size:15px;outline:none;font-family:inherit;margin:7px 0;transition:border-color .15s,box-shadow .15s;color:var(--ink)}
  .input:focus{border-color:var(--grn);box-shadow:var(--ring)}
  .input::placeholder{color:var(--grey2)}
  label{font-size:11.5px;font-weight:700;color:var(--grey);letter-spacing:.3px;text-transform:uppercase}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-s)}
  .cardp{padding:20px}
  .row{display:flex;align-items:center;gap:8px}
  .center{text-align:center}
  .muted{color:var(--grey);font-size:12px}
  a{color:var(--org);cursor:pointer;font-weight:700;text-decoration:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px;padding:6px 14px calc(120px + env(safe-area-inset-bottom,0px))}
  .grid .tile{min-width:0}
  .tile{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .2s;box-shadow:0 2px 8px -6px rgba(0,0,0,.12)}
  .tile:hover{transform:translateY(-3px);box-shadow:0 16px 30px -16px rgba(15,60,40,.35)}
  .tile .img{height:128px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .tile .img .e{font-size:50px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.08))}
  .tile .img img{width:100%;height:100%;object-fit:cover}
  .tile .img .new{position:absolute;left:8px;top:8px;background:var(--org);color:#fff;font-size:8.5px;font-weight:800;padding:4px 7px;border-radius:7px;letter-spacing:.4px;box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
  .tile .bd{padding:11px 12px 12px}
  .tile .bd h4{margin:0 0 4px;font-size:13.5px;line-height:1.25;font-weight:700}
  .tile .pr{color:var(--grn);font-weight:800;font-size:15px;letter-spacing:.2px}
  .tile .me{margin-top:6px;display:flex;justify-content:space-between;color:var(--grey2);font-size:10px;gap:6px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;background:#fff;border:1.5px solid var(--line2);border-radius:999px;padding:8px 15px;font-size:12.5px;cursor:pointer;font-weight:600;transition:.15s;color:var(--grey)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 8px 16px -10px rgba(0,0,0,.35)}
  .search{margin:4px 14px 2px;position:relative}
  .search .input{padding-left:42px;margin:0;border-radius:999px}
  .search .ic{position:absolute;left:15px;top:13px;color:var(--grey2);font-size:15px}
  .hdr{display:flex;align-items:center;padding:12px 16px}
  .hdr h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(20,40,30,.06)}
  .nav button{flex:1;border:none;background:none;padding:7px 0 8px;font-size:9.5px;font-weight:600;color:var(--grey);cursor:pointer;font-family:inherit;border-radius:12px;transition:.15s}
  .nav button .i{font-size:21px;display:block;margin-bottom:2px}
  .nav button.on{color:var(--grn);background:var(--grn-soft);font-weight:800}
  .nav button.on .i{transform:scale(1.05)}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#14261E;color:#fff;padding:12px 18px;border-radius:14px;z-index:99;opacity:0;transition:.28s;font-size:13.5px;max-width:92%;text-align:center;box-shadow:0 18px 40px -12px rgba(0,0,0,.5);font-weight:600}
  .scrim{position:fixed;inset:0;background:rgba(14,28,20,.5);z-index:50;display:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;z-index:70;border-radius:24px 24px 0 0;padding:8px 18px 26px;max-height:92vh;overflow:auto;box-shadow:0 -20px 60px rgba(0,0,0,.25);display:none}
  .modal{position:fixed;inset:0;z-index:60;display:none;background:var(--paper);max-width:480px;margin:0 auto;overflow:auto;padding-bottom:60px}
  .listItem{display:flex;gap:12px;align-items:center;padding:12px;background:#fff;border:1px solid var(--line);border-radius:14px;margin:8px 0;cursor:pointer;transition:.15s;box-shadow:var(--sh-s)}
  .listItem:hover{transform:translateX(3px)}
  .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--org-soft),var(--grn-soft));display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
  .statbox{display:flex;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 4px;margin:10px 0;box-shadow:var(--sh-s)}
  .statbox .st{flex:1;text-align:center}.statbox .st b{font-size:17px;display:block;font-weight:800}.statbox .st span{font-size:9px;color:var(--grey2)}
  .badge{display:inline-flex;align-items:center;background:var(--grn);color:#fff;font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:8px;letter-spacing:.3px}
  .pres{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--grn);background:var(--grn-soft);border:1px solid #C4E3D2;padding:4px 9px;border-radius:999px}
  .pres .dot{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 0 3px rgba(14,122,68,.16);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,122,68,.35)}70%{box-shadow:0 0 0 6px rgba(14,122,68,0)}100%{box-shadow:0 0 0 0 rgba(14,122,68,0)}}
  .pres.off{color:var(--grey);background:#F0F0EB;border-color:var(--line)}
  .pres.off .dot{background:#b9b4a8;box-shadow:none;animation:none}
  .catpill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:10px 15px;font-size:12.5px;cursor:pointer;font-weight:600;transition:.15s;color:var(--ink)}
  .catpill.on{border-color:var(--grn);background:var(--grn);color:#fff;box-shadow:0 8px 16px -8px rgba(14,122,68,.5)}
  .step{display:flex;gap:11px;margin:10px 0}
  .step .dot{width:24px;height:24px;border-radius:50%;background:#E8EAE3;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .step.done .dot{background:var(--grn);color:#fff}
  .step.now .dot{background:var(--org);color:#fff;box-shadow:0 0 0 5px var(--org-soft)}
  .step .body{flex:1}.step .body b{font-size:13.5px}.step .body p{margin:2px 0;color:var(--grey);font-size:11.5px}
  .info{background:var(--grn-soft);border:1px solid #C4E3D2;color:var(--grn-d);border-radius:13px;padding:11px 13px;font-size:12.5px;margin:8px 0;line-height:1.5}
  .warn{background:var(--org-soft);border:1px solid #FBDDBE;color:#A3541B;border-radius:13px;padding:11px 13px;font-size:12.5px;margin:8px 0;line-height:1.5}
  .box{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin:8px 0;box-shadow:var(--sh-s)}
  .load{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:12px;color:var(--grey);font-weight:600}
  .hero{position:relative;background:radial-gradient(120% 150% at 15% -10%,#1C9E63 0%,#0E7A44 42%,#075231 100%);color:#fff;padding:26px 20px 26px;border-radius:0 0 26px 26px;margin-bottom:4px;overflow:hidden;box-shadow:0 18px 40px -22px rgba(7,82,49,.7)}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 60%)}
  .hero::before{content:"";position:absolute;right:70px;bottom:-80px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 65%)}
  .hero h1{margin:0;font-size:26px;font-weight:800;line-height:1.08;position:relative;letter-spacing:-.5px;text-shadow:0 2px 18px rgba(0,0,0,.12)}
  .hero p{margin:10px 0 0;font-size:13.5px;opacity:.95;position:relative;line-height:1.5;font-weight:400}
  .hero .badges{display:flex;gap:8px;margin-top:16px;position:relative;flex-wrap:wrap}
  .hero .badge-chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);padding:7px 13px;border-radius:999px;font-size:11px;font-weight:600;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .catSection{padding:8px 14px}
  .catSection h3{font-size:16px;margin:16px 2px 10px;font-weight:800;letter-spacing:-.3px}
  .catRow{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
  .catCell{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center;cursor:pointer;transition:.18s;box-shadow:var(--sh-s)}
  .catCell:hover{transform:translateY(-3px);border-color:#BFE0CE;box-shadow:0 14px 26px -16px rgba(15,60,40,.4)}
  .catCell .e{font-size:27px;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.06))}
  .catCell span{font-size:11px;font-weight:700;display:block;margin-top:6px;color:var(--ink)}
  .sectionTitle{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
  .sectionTitle h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.3px}
  .sectionTitle a{font-size:12px;font-weight:700}
  .featureWrap{padding:6px 0 2px}
  .featured{display:flex;gap:12px;overflow-x:auto;padding:6px 16px 12px;scrollbar-width:none}
  .featured::-webkit-scrollbar{display:none}
  .fcard{flex:0 0 140px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;position:relative;transition:.18s;box-shadow:var(--sh-s)}
  .fcard:hover{transform:translateY(-3px)}
  .fcard.on{outline:2px solid var(--org);outline-offset:2px}
  .fcard .fimg{height:120px;display:flex;align-items:center;justify-content:center;position:relative}
  .fcard .fimg img{width:100%;height:100%;object-fit:cover}
  .fcard .fimg .e{font-size:46px}
  .fcard .fbd{padding:10px}
  .fcard .fbd .ft{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fcard .fbd .fp{color:var(--grn);font-weight:800;font-size:13.5px;margin-top:2px}
  .fcard .nbadge{position:absolute;left:7px;top:7px;background:var(--org);color:#fff;font-size:8px;font-weight:800;padding:3px 7px;border-radius:7px;letter-spacing:.4px;box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
  .fcard .promo{position:absolute;right:7px;top:7px;background:var(--grn);color:#fff;font-size:8px;font-weight:800;padding:3px 7px;border-radius:7px}
  .gallery{position:relative;background:#0f1613}
  .gallery img{width:100%;max-height:320px;object-fit:contain;background:#0f1613;display:block}
  .gallery .navbtn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.92);border:none;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .gallery .gprev{left:10px}.gallery .gnext{right:10px}
  .gallery .count{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 10px;border-radius:999px;-webkit-backdrop-filter:blur(4px)}
  .dots{display:flex;gap:6px;justify-content:center;padding:10px 0}
  .dots i{width:6px;height:6px;border-radius:50%;background:#D6DAD2;transition:.2s}
  .dots i.on{background:var(--org);width:18px;border-radius:999px}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
  .thumbWrap{position:relative;width:80px;height:80px;border-radius:13px;overflow:hidden;border:1px solid var(--line)}
  .thumbWrap img{width:100%;height:100%;object-fit:cover}
  .thumbWrap .rm{position:absolute;top:3px;right:3px;background:#e6453c;color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;line-height:20px}
  .addPhoto{width:80px;height:80px;border:2px dashed var(--org);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--org);background:var(--org-soft);cursor:pointer;flex-direction:column;font-size:11px;transition:.15s}
  .addPhoto:hover{background:#ffe6cc}
  .shell.nopad{padding-bottom:0!important}
  .chatHead{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line)}
  .chatBox{height:calc(100dvh - 190px);max-height:70vh;overflow-y:auto;padding:16px 14px 10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
  .chatItem{display:flex;gap:10px;align-items:center;padding:12px;background:#fff;border:1px solid var(--line);border-radius:14px;margin:8px 0;cursor:pointer;box-shadow:var(--sh-s)}
  .bubble{max-width:78%;padding:10px 13px;border-radius:18px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;position:relative;box-shadow:0 2px 6px -4px rgba(0,0,0,.12)}
  .bubble .bt{font-size:9.5px;opacity:.65;display:block;margin-top:4px;text-align:right}
  .bubble.me{background:linear-gradient(135deg,#129452,#0E7A44);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
  .bubble.them{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
  .chatInput{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid var(--line);align-items:center}
  .chatInput .input{margin:0;border-radius:999px}
  .sendBtn{background:linear-gradient(135deg,#129452,#0E7A44);color:#fff;border:none;border-radius:50%;width:48px;height:48px;font-size:20px;cursor:pointer;flex:none;box-shadow:0 8px 16px -8px rgba(14,122,68,.6)}
  .daysep{text-align:center;font-size:10px;color:var(--grey2);margin:10px 0 4px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
  .unreadDot{width:9px;height:9px;border-radius:50%;background:var(--sang);flex:none}
  mark{background:#F6C453;color:#14261E;border-radius:3px;padding:0 2px}
  .chatCtx{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
  .ctxTh{width:42px;height:42px;border-radius:10px;object-fit:cover;flex:none;overflow:hidden;background:linear-gradient(160deg,#E3F3E9,#FBEEDC);display:flex;align-items:center;justify-content:center;font-size:22px}
  .ctxTh img{width:100%;height:100%;object-fit:cover}
  .csbar{display:none;align-items:center;gap:8px;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line)}
  .quickPanel{display:none;background:#fff;border-top:1px solid var(--line);padding:6px 10px;max-height:40vh;overflow:auto}
  .qr{border:1px solid var(--line2);background:#fff;border-radius:11px;padding:8px 10px;margin:4px 0;font-size:12.5px;cursor:pointer;color:var(--ink)}
  .qr:hover{background:var(--grn-soft);border-color:#C4E3D2}
  /* ===== Premium onboarding / auth ===== */
  .authHero{background:radial-gradient(120% 160% at 15% -8%,#1C9E63 0%,#0E7A44 46%,#075231 100%);border-radius:0 0 30px 30px;padding:34px 22px 26px;color:#fff;text-align:center;position:relative;overflow:hidden}
  .authHero::after{content:"";position:absolute;right:-70px;top:-70px;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 60%)}
  .authHero .markWrap{width:92px;height:92px;margin:0 auto 16px;filter:drop-shadow(0 14px 26px rgba(0,0,0,.25))}
  .authHero h1{margin:6px 0 0;font-size:25px;font-weight:800;letter-spacing:-.5px;position:relative}
  .authHero p{margin:9px auto 0;font-size:13.5px;opacity:.94;max-width:300px;line-height:1.5;position:relative}
  .perk{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin:9px 0;box-shadow:var(--sh-s)}

<body>

<script>
/* ============== CONSTANTES & CATALOGUES ============== */
const COMM_RATE=0.06;
const CATS=[
 {id:'phone',e:'📱',n:'Téléphones'},{id:'computer',e:'💻',n:'Ordinateurs'},
 {id:'cars',e:'🚗',n:'Voitures & Moto'},{id:'fashion',e:'👗',n:'Mode & Friperie'},
 {id:'drepaker',e:'🕶️',n:'Drepaker'},
 {id:'furniture',e:'🛋️',n:'Meubles'},{id:'electronics',e:'🎧',n:'Électronique'},
 {id:'sports',e:'⚽',n:'Sport & Loisirs'},{id:'books',e:'📚',n:'Livres'}];
const CONDS=['Neuf','Comme neuf','Très bon état','Bon état','Correct','À réparer'];
function catOf(id){return CATS.find(c=>c.id===id)||CATS[3]}
/* ===== Services « Bende » : petits boulots & talents des jeunes ===== */
const SVCS=[
 {id:'cours',e:'📚',n:'Cours & tutorat'},
 {id:'livraison',e:'🛵',n:'Livraison / course'},
 {id:'beaute',e:'💇🏾',n:'Beauté & coiffure'},
 {id:'couture',e:'🧵',n:'Couture / retouche'},
 {id:'photo',e:'📸',n:'Photo & vidéo'},
 {id:'info',e:'💻',n:'Informatique / montage'},
 {id:'mecanique',e:'🔧',n:'Réparation / méca'},
 {id:'menage',e:'🧹',n:'Ménage / aide'},
 {id:'autre',e:'✨',n:'Autre talent'}];
const SVC_UNITS=[['h',"à l'heure"],['jour','à la journée'],['forfait','forfait / devis']];
function svcCatOf(id){return SVCS.find(s=>s.id===id)||SVCS[SVCS.length-1]}
function isSvc(l){return !!(l&&l.svc)}
function svcUnitLbl(u){const x=SVC_UNITS.find(s=>s[0]===u);return x?x[1]:''}
function svcPriceTxt(l){ if(!l)return ''; if(!l.p)return 'Tarif à discuter'; return fmt(l.p)+' FCFA'+(l.svcUnit?(' · '+svcUnitLbl(l.svcUnit)):''); }
function svcTypeName(l){ return l&&l.svcType? svcCatOf(l.svcType).n : ''; }
function fmt(n){return Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
// --- Séparateur de montants à la saisie ---
// Formate en direct un champ prix (espaces des milliers) tout en gardant la valeur réelle en JS.
function moneyFmt(el){ if(!el)return; const d=String(el.value||'').replace(/\D/g,''); el.value=d?fmt(d):''; }
// Lit un prix saisi (avec ou sans espaces) en nombre entier FCFA.
function parseMoney(v){ const d=String(v==null?'':v).replace(/\D/g,''); return parseInt(d,10)||0; }
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function timeago(t){if(!t)return '';let s=(Date.now()-t)/1000;if(s<60)return 'à l\'instant';if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';return Math.floor(s/86400)+' j'}
function uidr(){return Math.random().toString(36).slice(2,9)}
function logoMark(s){var u='hk'+Math.floor(Math.random()*1e6);return '<svg class="hkmark" width="'+s+'" height="'+s+'" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="'+u+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C9E63"/><stop offset=".55" stop-color="#0E7A44"/><stop offset="1" stop-color="#0A5E34"/></linearGradient></defs><rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="url(#'+u+')"/><rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.1"/><path d="M16.5 12.5v15c0 3.6 2.9 6.5 6.5 6.5" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M31.5 12.5v15c0 3.6-2.9 6.5-6.5 6.5" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M16.5 25h15" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><circle cx="37" cy="10" r="3" fill="#FFA13E" stroke="#0E7A44" stroke-width="1"/></svg>';}
function toast(m){let t=document.getElementById('toast');t.innerHTML=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,2400)}
// ---------- Gestion du bouton retour (v28, navigateur + PWA installée) ----------
// Le bouton retour système (Android/iOS) doit d'abord fermer la fenêtre ouverte
// (sheet/modal) et ne quitter l'app que si rien n'est affiché — que l'app soit
// ouverte dans un navigateur (même avec un historique web préexistant) ou en PWA
// installée. On pousse une entrée d'historique à l'ouverture pour intercepter le
// retour, et on se base sur la VISIBILITÉ RÉELLE de la fenêtre (pas seulement un
// compteur) pour ne JAMAIS quitter tant qu'une fenêtre est ouverte.
let _ovDepth=0, _suppressPop=0;
function _hideOverlays(){['scrim','sheet','modal'].forEach(i=>{const el=document.getElementById(i); if(el)el.style.display='none';});}
function _ovVisible(){
  // Détecte TOUTE fenêtre ouverte : sheet & modal (qui affichent le scrim), et le
  // modal plein écran qui, lui, ne passe PAS par le scrim.
  var sc=document.getElementById('scrim'),sh=document.getElementById('sheet'),mo=document.getElementById('modal');
  if(sc&&sc.style.display==='block') return true;
  if(sh&&sh.style.display==='block') return true;
  if(mo&&mo.style.display==='block') return true;
  return false; }
function _pushOv(){ _ovDepth++; try{ history.pushState({h:1},''); }catch(e){} }
window.addEventListener('popstate',function(){
  if(_suppressPop>0){ _suppressPop--; return; }
  // 1) Fenêtre ouverte (overlay sheet/modal) : on la ferme et on RESTE dans l'app.
  if(_ovDepth>0 || _ovVisible()){
    if(_ovDepth>0) _ovDepth--;
    _hideOverlays();
    return;
  }
  // 2) Écran de conversation (chat plein écran) : on le ferme et on revient à
  //    l'écran précédent (l'entrée d'historique vient d'être consommée par le
  //    navigateur, on ne refait donc pas history.back()).
  if(_chatEntry && _activeCid){
    _chatEntry=false;
    _closeConvNow();
    return;
  }
  // 3) Sinon rien d'ouvert : comportement par défaut (sortie normale).
});
function closeAll(){
  // Fermeture (✕, scrim, action terminée) : on retire l'entrée d'historique de la fenêtre.
  if(_ovDepth>0 || _ovVisible()){
    const hadState=_ovDepth>0;
    _ovDepth=0; _hideOverlays();
    if(hadState){ _suppressPop++; try{ history.back(); }catch(e){} }
  }
  else _hideOverlays();
}
function _openOverlay(show){
  _hideOverlays();
  // Une fenêtre était déjà ouverte : on retire son entrée avant d'en pousser une
  // neuve (l'app n'affiche qu'UNE fenêtre à la fois).
  if(_ovDepth>0){ _ovDepth=0; _suppressPop++; try{ history.back(); }catch(e){ _suppressPop--; _ovDepth++; } }
  _pushOv(); show();
}
function openSheet(h){ _openOverlay(()=>{ const sh=document.getElementById('sheet'); if(sh)sh.innerHTML=h; const sc=document.getElementById('scrim'),s2=document.getElementById('sheet'); if(sc)sc.style.display='block'; if(s2)s2.style.display='block'; }); }
function openModal(h){ _openOverlay(()=>{ const m=document.getElementById('modal'); if(m){m.innerHTML=h; m.style.display='block';} }); }
function renderApp(h){document.getElementById('app').innerHTML=h}

/* ============== FIREBASE ============== */
let db, auth, curUser=null, curProfile=null;
// Cache des profils vendeurs (par uid) pour la page vendeur détaillée.
let sellerCache={};
async function getSeller(uid){ if(sellerCache[uid]) return sellerCache[uid];
  try{ const d=await db.collection('users').doc(uid).get(); sellerCache[uid]= d.exists?d.data():null; }
  catch(e){ sellerCache[uid]=null; } return sellerCache[uid]; }
// Affiche/rafraichit la presence du vendeur dans la fiche annonce.
async function loadDetailPres(sid){ if(!sid) return;
  const s=await getSeller(sid); const el=document.getElementById('detPres');
  if(!el) return; el.innerHTML=presChip(s);
  if(el._pt) clearInterval(el._pt);
  el._pt=setInterval(async()=>{ if(document.hidden) return; const s2=await getSeller(sid); const e2=document.getElementById('detPres'); if(e2) e2.innerHTML=presChip(s2); },30000);
}

// Notifications générées à partir des transactions de l'utilisateur (aucun
// stockage serveur nécessaire). État "lu" conservé en local par utilisateur.
let notifsCache=[];
let notifUnread=0;
function notifReadKey(uid){return 'ham_notifread_'+uid;}
function buildNotifs(uid){
  if(!uid) { notifsCache=[]; notifUnread=0; return; }
  let arr=[];
  // Notifications de transactions me concernant
  txCache.forEach(t=>{
    const meAsBuyer = t.buyerId===uid, meAsSeller = t.sellerId===uid;
    const ts=t.updatedAt||t.createdAt||Date.now();
    if(meAsSeller && t.status==='agreed' && !t.validBuyer){
      arr.push({id:t.id+'_req',icon:'🛒',title:'Nouvelle transaction',body:esc(t.buyerName)+' veut acheter « '+esc(t.itemTitle)+' » ('+fmt(t.price)+' FCFA).',time:ts,read:false});
    }
    if(meAsSeller && t.validBuyer && !t.validSeller && t.status!=='done'){
      arr.push({id:t.id+'_buyerok',icon:'✅',title:'L\'acheteur a confirmé',body:esc(t.buyerName)+' a reçu l\'article. Confirme le paiement reçu pour clôturer.',time:ts,read:false});
    }
    if(meAsBuyer && t.validSeller && !t.validBuyer && t.status!=='done'){
      arr.push({id:t.id+'_sellerok',icon:'✅',title:'Le vendeur a confirmé',body:esc(t.sellerName)+' a confirmé le paiement. Confirme la réception.',time:ts,read:false});
    }
    if(t.status==='done' && meAsSeller){
      arr.push({id:t.id+'_done',icon:'🎉',title:'Vente terminée',body:'« '+esc(t.itemTitle)+' » : commission '+fmt(t.commission)+' FCFA tracée pour Hametkro.',time:ts,read:false});
    }
    if(t.status==='dispute'){
      arr.push({id:t.id+'_disp',icon:'⚠️',title:'Litige en cours',body:'« '+esc(t.itemTitle)+' » : l\'admin va arbitrer.',time:ts,read:false});
    }
  });
  // Notifications « Dépannage groupé » : quand un palier d'un de mes groupes est atteint.
  // Dérivées des annonces (allListings) dont je suis le vendeur — même modèle que ci-dessus.
  try{
    (allListings||[]).forEach(l=>{
      if(!l||l.sellerId!==uid) return;
      if(!gbActive(l)) return;
      const n=gbCount(l); let best=null;
      gbTiers(l).forEach(t=>{ if(n>=t.min && (!best||t.off>best.off)) best=t; });
      if(best){
        const ts=(l.gb&&l.gb.updatedAt)||l.time||Date.now();
        arr.push({id:'gb_'+l.id+'_'+best.min,icon:'🤝',title:"Groupe d'achat : palier atteint",
          body:'« '+esc(l.t)+' » : '+n+' participant'+(n>1?'s':'')+' → −'+best.off+' % débloqué pour le groupe.',time:ts,read:false});
      }
    });
  }catch(e){ console.error('GBNOTIF',e&&e.message); }

  arr.sort((a,b)=>b.time-a.time);
  const readSet=new Set(JSON.parse(localStorage.getItem(notifReadKey(uid))||'[]'));
  arr.forEach(n=>{ if(readSet.has(n.id)) n.read=true; });
  notifsCache=arr.slice(0,30);
  notifUnread=arr.filter(n=>!n.read).length;
}
function markNotifsRead(){ if(!curProfile)return; const u=curProfile.uid;
  const readSet=new Set(JSON.parse(localStorage.getItem(notifReadKey(u))||'[]'));
  notifsCache.forEach(n=>readSet.add(n.id)); notifsCache.forEach(n=>n.read=true); notifUnread=0;
  localStorage.setItem(notifReadKey(u),JSON.stringify([...readSet])); }
function openNotifs(){ if(!curProfile)return openAuth(); markNotifsRead(); shell();
  openModal(`<div style="padding:14px 16px"><div class="row" style="justify-content:space-between"><b style="font-size:17px">🔔 Notifications</b><span style="cursor:pointer;font-size:20px" onclick="closeAll()">✕</span></div>
    <div style="margin-top:6px">${notifsCache.length?notifsCache.map(n=>`<div class="box" style="display:flex;gap:10px;align-items:flex-start;border-left:3px solid ${n.read?'var(--line)':'var(--org)'}"><div style="font-size:22px">${n.icon}</div><div class="grow"><b>${n.title}</b>${!n.read?' <span class="badge">nouveau</span>':''}<p class="muted" style="margin:2px 0">${n.body}</p><div class="muted" style="font-size:10px">${timeago(n.time)}</div></div></div>`).join(''):'<p class="muted center" style="padding:30px 0">Aucune notification pour le moment.</p>'}</div></div>`); }

// Charge le profil Firestore de l'utilisateur courant (ou null si non connecté).
async function refreshMe(){
  const u=auth&&auth.currentUser;
  curUser=u;
  if(!u){ curProfile=null; return; }
  try{ const d=await db.collection('users').doc(u.uid).get(); curProfile=d.exists?d.data():null; }
  catch(e){ curProfile=null; }
}
function fb(){
  firebase.initializeApp(window.HAM_FIREBASE_CONFIG);
  auth=firebase.auth(); db=firebase.firestore();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
  // Cache Firestore hors-ligne (persistance) : réduit les lectures réseau et donc
  // la consommation de quota, et rend l'app utilisable hors-ligne. Doit être
  // demandé tôt. .catch(()=>{}) : en cas de multi-onglets on n'en tient pas compte
  // sans bloquer (Firestore refuse alors, on continue en ligne).
  if(db.enablePersistence) db.enablePersistence().catch(()=>{});
  auth.onAuthStateChanged(async u=>{
    curUser=u;
    if(u){
      try{const d=await db.collection('users').doc(u.uid).get(); curProfile=d.exists?d.data():null;}
      catch(e){curProfile=null;}
      // Cas inscription : le doc peut être écrit juste APRÈS ce premier read.
      if(!curProfile){ await new Promise(r=>setTimeout(r,700)); try{const d=await db.collection('users').doc(u.uid).get(); curProfile=d.exists?d.data():null;}catch(e){} }
      afterAuthRebuild(u); startPresence();
      setTimeout(maybeOnboard, 1300); // onboarding robuste, une fois le profil chargé
    } else { curProfile=null; notifsCache=[]; notifUnread=0; stopPresence(); }
    boot();
  });
}
/* ====== PRESENCE "en ligne" ======
 * Optimisation quota (plan gratuit) : on écrivait `users/{uid}.presence` toutes
 * les 20 s, soit ~3 écritures/min/utilisateur (premier consommateur d'écritures).
 * Désormais : battement toutes les 60 s ET seulement quand l'onglet est visible.
 * Fenêtre "en ligne" élargie (150 s) pour ne pas déclarer hors-ligne à tort
 * entre deux battements. Réduction ~3-4x des écritures presence.
 */
let presenceTimer=null;
function startPresence(){
  if(presenceTimer) clearInterval(presenceTimer);
  if(!auth || !auth.currentUser) return;
  const uid=auth.currentUser.uid;
  let lastWrite=0;
  const beat=()=>{
    // Écrit seulement si l'onglet est visible (pas de gaspillage en arrière-plan)
    // et si ce n'est pas déjà très récent (évite les écritures redondantes).
    if(document.hidden) return;
    const now=Date.now();
    if(now-lastWrite<30000) return;
    lastWrite=now;
    db.collection('users').doc(uid).update({presence:now}).catch(()=>{});
  };
  beat();
  presenceTimer=setInterval(beat, 60000);
  const onVis=()=>{ if(!document.hidden) beat(); };
  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('beforeunload', ()=>{ if(presenceTimer) clearInterval(presenceTimer);
    document.removeEventListener('visibilitychange', onVis);
    db.collection('users').doc(uid).update({presence:Date.now()-150000}).catch(()=>{}); });
}
function stopPresence(){ if(presenceTimer){ clearInterval(presenceTimer); presenceTimer=null; } }
function isOnline(p){ return !!(p && p.presence && (Date.now()-p.presence)<150000); }
function presChip(p){ return isOnline(p)?'<span class="pres"><i class="dot"></i>En ligne</span>':'<span class="pres off"><i class="dot"></i>Hors ligne</span>'; }
function isAdmin(){return curProfile&&curProfile.role==='admin'}

/* ============== ROUTAGE ============== */
let view='home', catF='all', q='', svcShow='', coinOn=false, allListings=[];
// Pagination du fil (leçon Vendito : ne jamais tout charger/afficher d'un coup).
let feedShow=24;            // nb d'annonces affichées dans la grille
let sortBy='rec';           // rec | priceAsc | priceDesc (tri du fil d'annonces)
function setSort(s){sortBy=s;feedShow=24;shell();}
let _listListened=false;    // garantit un seul abonnement listings/session
// Favoris / ville / alertes de recherche (Paquet A)
let cityF='all', myFavs=new Set(), favReady=false, myAlerts=[];
function hasFav(id){ return myFavs.has(id); }
function citiesOf(){ const s=new Set(); (allListings||[]).forEach(l=>{ if(l.city) s.add(l.city); }); return [...s].sort(); }
function boot(){ shell(); }
function shell(){
  // Si un fil de discussion est affiché en plein écran, on ne ré-affiche pas
  // le shell à cause d'un snapshot en arrière-plan (bug de sortie du chat).
  if(chatIsOpen()) return;
  if(view!=='home'){ svcShow=''; coinOn=false; } // modes dédiés : seulement sur l'accueil
  // Abonnements admin paresseux (économie de lectures) : actifs seulement sur la
  // vue 'admin'. À appeler avant le rendu pour que les données soient prêtes.
  _admEnsure(view);
  let body = view==='home'?homeV(): view==='sell'?sellV(): view==='msg'?messagesV(): view==='me'?profileV(): view==='admin'?adminV(): view==='resto'?restoV(): homeV();
  let top = curProfile? `<div class="logo grow">${logoMark(30)}<span class="words"><span class="word">hamet<b>kro</b></span><small>${esc(curProfile.country||"Côte d'Ivoire")} ${(curProfile.countryCode==='CI'||!curProfile.countryCode)?'🇨🇮':'🌍'} · ${esc(curProfile.city||'')}</small></span></div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="text-align:right;font-size:11.5px;color:var(--grey);font-weight:600">${esc((curProfile.name||'Compte').split(' ')[0])}${isAdmin()?' <span class="badge">ADMIN</span>':''}</div>
        <div style="position:relative;cursor:pointer;width:36px;height:36px;border-radius:50%;background:var(--grn-soft);display:flex;align-items:center;justify-content:center" onclick="openNotifs()"><span style="font-size:18px">🔔</span>
          ${notifUnread>0?`<span style="position:absolute;top:-3px;right:-3px;background:var(--sang);color:#fff;font-size:9px;font-weight:800;border-radius:50%;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 3px;box-shadow:0 0 0 2px #fff">${notifUnread}</span>`:''}</div>
      </div>`
    : `<div class="logo grow">${logoMark(30)}<span class="words"><span class="word">hamet<b>kro</b></span><small>Marché ivoirien 🇨🇮</small></span></div>
      <button class="btn g sm" onclick="openAuth()">Se connecter</button>`;
  let items=[['home','🏠','Accueil'],['resto','🍽️','Repas'],['sell','🗂️','Vendre']];
  if(curProfile) items.push(['msg','💬','Messages']);
  items.push(['me','👤','Compte']);
  // Le badge « non-lus » de Messages est posé dynamiquement par updateMsgNavBadge()
  // (appelé après le rendu), pour qu'il soit mis à jour en direct quel que soit l'écran.

// ============== DÉPANNAGE GROUPÉ (Idée 3) ==============
/* Achat groupé : le vendeur active des paliers (ex 3 → −5 %, 6 → −10 %), les
 * acheteurs « rejoignent le groupe » ; quand un seuil est atteint le prix réduit
 * est débloqué et chacun lance sa transaction sécurisée individuelle au tarif
 * réduit. Uniquement pour les articles (pas services), jamais en cas de vente. */
const GB_DEFAULT_TIERS=[{min:3,off:5},{min:6,off:10}];
function gbActive(l){ return !!(l&&!l.svc&&!l.sold&&l.gb&&l.gb.on); }
function gbTiers(l){ return (gbActive(l)&&Array.isArray(l.gb.tiers))?l.gb.tiers.filter(t=>t&&t.min>0).slice().sort((a,b)=>a.min-b.min):[]; }
function gbMembers(l){ return (l&&l.gb&&Array.isArray(l.gb.members))?l.gb.members.slice():[]; }
function gbCount(l){ return gbMembers(l).length; }
function gbIsMember(l,uid){ return !!uid&&gbMembers(l).some(m=>m.uid===uid); }
// Remise actuellement débloquée (meilleur palier dont min <= nb de membres).
function gbReachedOff(l){ const n=gbCount(l); let off=0; gbTiers(l).forEach(t=>{ if(n>=t.min&&t.off>off) off=t.off; }); return off; }
function gbNextTier(l){ const n=gbCount(l); return gbTiers(l).find(t=>n<t.min)||null; }
// Prix réduit pour un membre une fois le seuil atteint (sinon null → prix plein).
function gbMemberPrice(l,uid){ if(!gbActive(l))return null; const off=gbReachedOff(l); if(!gbIsMember(l,uid)||off<=0)return null; return Math.round(l.p*(1-off/100)); }
function gbReducedPrice(l){ const off=gbReachedOff(l); return off>0?Math.round(l.p*(1-off/100)):null; }
function gbTierText(t){ return `≥ ${t.min} · −${t.off} %`; }

// Compression renforcée (v26) : WebP quand supporté, sinon JPEG (repli auto).
// Plus petite et moins lourde → reste bien sous la limite Firestore et économise le quota.
let _webpOk=null;
function webpSupported(){ if(_webpOk!==null) return _webpOk;
  try{ _webpOk=document.createElement('canvas').toDataURL('image/webp').indexOf('data:image/webp')===0; }
  catch(e){ _webpOk=false; } return _webpOk; }
function compressFile(file,maxSize,maxQ){return new Promise((res)=>{let r=new FileReader();r.onload=()=>{let img=new Image();img.onload=()=>{
  let m=Math.min(1,maxSize/Math.max(img.width,img.height));
  let cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*m));cv.height=Math.max(1,Math.round(img.height*m));
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  const q=maxQ||.66;
  // WebP ~30% plus léger que JPEG à qualité comparable ; sinon on retombe sur JPEG.
  const out=webpSupported()?cv.toDataURL('image/webp',q):cv.toDataURL('image/jpeg',q);
  res(out);};img.onerror=()=>res(null);img.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file);});}

// Met à jour EN DIRECT le petit badge « non-lus » de l'onglet Messages dans la barre

// Appelé dès qu'un message arrive, quel que soit l'écran où se trouve le vendeur.
function updateMsgNavBadge(){
  const nav=document.querySelector('.nav');
  if(!nav) return;
  let btn=null;
  Array.from(nav.querySelectorAll('button')).forEach(b=>{
    const sp=b.querySelector('.i'); if(sp && (b.textContent||'').trim().toLowerCase().includes('messages')) btn=sp;
  });
  if(!btn) return;
  let old=btn.querySelector('.msgBadge'); if(old) old.remove();
  if(msgUnread>0){
    const el=document.createElement('span');
    el.className='msgBadge';
    el.style.cssText='position:absolute;top:-4px;right:-6px;background:var(--sang);color:#fff;font-size:9px;font-weight:800;border-radius:50%;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;box-shadow:0 0 0 2px #fff';

    btn.style.position='relative';
    btn.appendChild(el);
  }
}
function fmtClock(t){ if(!t)return ''; const d=new Date(t); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function convItem(){ const c=_convData; if(!c)return null; return (allListings||[]).find(l=>l.id===c.itemId)||null; }
// Indicateur "en train d'écrire…" : écritures limitées (début + fin de saisie).
let _typingActive=false, _typingTimer=null, _typingLastWrite=0;
// Rafraîchit `typing` au démarrage puis ~1x/2,5 s pendant la frappe (écritures limitées),
// et l'efface après 3,5 s d'inactivité => indicateur « écrit… » précis côté récepteur.
function chatTypingStart(){ if(!_activeCid||!curProfile)return;
  const now=Date.now();
  if(!_typingActive){ _typingActive=true; _typingLastWrite=now;
    db.collection('conversations').doc(_activeCid).update({typing:{uid:curProfile.uid,at:now}}).catch(()=>{}); }
  else if(now-_typingLastWrite>2500){ _typingLastWrite=now;
    db.collection('conversations').doc(_activeCid).update({typing:{uid:curProfile.uid,at:now}}).catch(()=>{}); }
  if(_typingTimer)clearTimeout(_typingTimer);
  _typingTimer=setTimeout(chatTypingStop, 3500); }
function chatTypingStop(){ if(!_activeCid)return; _typingActive=false;
  if(_typingTimer){clearTimeout(_typingTimer);_typingTimer=null;}

// Surlignage insensible à la casse d'un terme (texte déjà échappé).
function escRe(x){ return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function markHl(text,q){ if(!q) return text; try{ return text.replace(new RegExp('('+escRe(q)+')','ig'),'<mark>$1</mark>'); }catch(e){ return text; } }
function convBubbles(c,q){ const me=curProfile?curProfile.uid:null; const s=(q||'').trim().toLowerCase();
  let msgs=(c&&c.msgs)||[];
  if(s) msgs=msgs.filter(m=>((m.text||'').toLowerCase().includes(s)));
  if(!msgs.length) return s?`<p class="muted center" style="padding:30px 0">Aucun résultat pour « ${esc(q)} » 🔍</p>`:`<p class="muted center" style="padding:30px 0">Dites bonjour 👋</p>`;
  const otherU=otherUid(c); const otherSeen= (otherU&&c&&c.seen)?(c.seen[otherU]||0):0;
  let lastDay=''; let out=''; let prevMine=null;
  msgs.forEach(m=>{ const day=new Date(m.time).toDateString();
    if(day!==lastDay){ out+=`<div class="daysep">${new Date(m.time).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>`; lastDay=day; }
    const mine=m.uid===me;
    const mt = prevMine===mine ? 2 : 6;
    const imgHtml = m.img?`<img src="${esc(m.img)}" style="max-width:190px;max-height:240px;border-radius:12px;display:block">`:'';
    const capHtml = (m.text&&m.img)?`<div style="font-size:10px;opacity:.85;margin-top:2px">${markHl(esc(m.text),s)}</div>`:'';
    const txtHtml = (m.text&&!m.img)?markHl(esc(m.text),s):'';
    let meta='';
    if(mine){ const read = otherSeen && m.time<=otherSeen;
      meta=`<span style="font-size:9.5px">${timeago(m.time)} ${read?'<span style="color:#C9F5DE;font-weight:800">✓✓</span>':'<span style="opacity:.75">✓</span>'}</span>`; }
    else { meta=`<span style="font-size:9.5px">${esc(m.name||'')} · ${fmtClock(m.time)}</span>`; }
    out+=`<div class="bubble ${mine?'me':'them'}" style="margin-top:${mt}px;${mine?'':'border-top-left-radius:'+(mt>2?'18px':'8px')+';'}${mine?'border-top-right-radius:'+(mt>2?'18px':'8px')+';':''}">${imgHtml}${txtHtml}${capHtml}<span class="bt">${meta}</span></div>`;
    prevMine=mine; });
  return out; }

function chatOnPhoto(inp){ const f=inp.files&&inp.files[0]; inp.value=''; if(!f||!_activeCid) return;
  const r=new FileReader(); r.onload=()=>{ const img=new Image();
    img.onload=()=>{ const max=640; let m=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(img.width*m)); cv.height=Math.max(1,Math.round(img.height*m));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); _chatImg=cv.toDataURL('image/jpeg',.72); sendMsg(); };

async function sendMsg(){ const inp=document.getElementById('msgText'); const txt=inp?inp.value.trim():'';
  const img=_chatImg; if((!txt&&!img)||!_activeCid) return;
  // Anti-arnaque : si le message contient des motifs à risque, on demande confirmation.
  if(txt){ const _risk=scanRisk(txt); if(_risk.length){ const ok=await confirmRisky(txt,_risk); if(!ok){ if(inp) inp.value=txt; return; } } }
  if(inp) inp.value=''; _chatImg=null; chatTypingStop();

  msg.text = img? (txt||'📷 Photo') : txt;
  if(img) msg.img=img;
  // Écho OPTIMISTE : on affiche ton message immédiatement (aucune attente réseau),
  // puis on le confirme côté Firestore. Le snapshot serveur réconcilie ensuite.
  const prev=(_convData&&_convData.msgs)?_convData.msgs.slice():[];
  _convData.msgs=((_convData&&_convData.msgs)||[]).concat([msg]);
  _convData.lastAt=now;

  // d'envoi simultané par les deux interlocuteurs.
  const fv=firebase.firestore.FieldValue;

    // écoute l'écriture de cette conversation (doc ajouté) et notifie
    // l'autre participant automatiquement. Plus aucun appel réseau du client
    // vers un endpoint d'hébergeur => fonctionne sur GitHub Pages comme partout.
  }).catch(e=>{ console.error('CHAT_SEND_ERR', e && e.code, e && e.message);
    const i=_pendingMsgs.indexOf(msg); if(i>=0)_pendingMsgs.splice(i,1);
    // Échec : on remet la zone d'envoi comme avant, le snapshot serveur rétablira l'état.
    toast('❌ Envoi impossible — vérifie ta connexion');
    _convData.msgs=prev;
    const s2=document.getElementById('convSc'); if(s2) s2.innerHTML=convBubbles(_convData,_convSearch||'');
    if(inp&&txt) inp.value=txt; _chatImg=img; });
}
/* ============== TRANSACTION SÉCURISÉE ============== */

  <div class="info">Transaction <b>sécurisée</b> : validation mutuelle acheteur + vendeur, commission ${Math.round(COMM_RATE*100)}% tracée.</div>
  <label>Prix convenu (FCFA) *</label><input id="ag_p" class="input" type="text" inputmode="numeric" value="${fmt(gbMemberPrice(l,curProfile.uid)||l.p)}" autocomplete="off" oninput="moneyFmt(this)">
  <label>Mode de remise</label>
  <div class="row" style="gap:8px;margin:8px 0">
   <div class="card grow" style="cursor:pointer;padding:10px;text-align:center;border:2px solid var(--org)" onclick="pickMode('hand',this)"><div style="font-size:24px">🤝</div><b>Main propre</b><div class="muted">Lieu public</div></div>
   <div class="card grow" style="cursor:pointer;padding:10px;text-align:center" onclick="pickMode('delivery',this)"><div style="font-size:24px">📦</div><b>Livraison</b><div class="muted">Coursier / relais</div></div></div>
  <input type="hidden" id="ag_mode" value="hand">
  <div id="ag_note" class="info">📍 Remettez l'article en lieu public sécurisé. Paie à la réception, jamais d'avance.</div>
  <button class="btn g" onclick="createTx('${id}')">Lancer la transaction sécurisée</button>`);}
function pickMode(m,el){el.closest('.row').querySelectorAll('.card').forEach(x=>x.style.border='2px solid var(--line)');el.style.border='2px solid var(--org)';document.getElementById('ag_mode').value=m;document.getElementById('ag_note').innerHTML=m==='hand'?'📍 Remise en lieu public sécurisé. Paie à la réception.':'📦 Suivi livraison / point relais. L\'acheteur confirme la réception.'}
async function createTx(id){let l=allListings.find(x=>x.id===id);let p=parseMoney(val('ag_p'));if(!p||p<=0)return toast('Prix invalide');
 let doc=db.collection('transactions').doc();let now=Date.now();
 await doc.set({id:doc.id,itemId:id,itemTitle:l.t,buyerId:curProfile.uid,buyerName:curProfile.name,sellerId:l.sellerId,sellerName:l.sellerName,participants:[curProfile.uid,l.sellerId],mode:document.getElementById('ag_mode').value,price:p,status:'agreed',validBuyer:false,validSeller:false,commission:Math.round(p*COMM_RATE),createdAt:now,updatedAt:now});
 closeAll();toast('✅ Transaction sécurisée lancée');view='sell';shell();}
function txCard(t){let u=curProfile;let isBuyer=t.buyerId===u.uid;let isSeller=t.sellerId===u.uid;
 let steps=[['agreed','Accord prix','Convenu à '+fmt(t.price)+' FCFA'],['meet','Remise / réception',t.mode==='hand'?'En main propre (lieu public)':'Livraison'],['buyer_ok','L\'acheteur valide la réception',isBuyer?'À toi de confirmer':'En attente de '+esc(t.buyerName)],['seller_ok','Le vendeur valide le paiement',isSeller?'À toi de confirmer':'En attente de '+esc(t.sellerName)],['done','Clôturée','Commission '+fmt(t.commission)+' FCFA ('+Math.round(COMM_RATE*100)+'%) tracée']];
 let idx=t.status==='done'?4:(t.validBuyer?3:(t.status==='meet'||t.validSeller?2:1));
 let h='';steps.forEach((s,i)=>{let st=i<idx?'done':(i===idx?'now':'todo');h+=`<div class="step ${st}"><div class="dot">${st==='done'?'✓':(st==='now'?'●':i+1)}</div><div class="body"><b>${s[1]}</b><p>${s[2]}</p></div></div>`;});
 let act='';
 if(t.status!=='done'&&t.status!=='dispute'){
   if(isBuyer&&!t.validBuyer)act=`<button class="btn g sm" onclick="confirmTx('${t.id}','buyer')">Je confirme avoir reçu l'article</button>`;
   else if(isSeller&&!t.validSeller)act=`<button class="btn g sm" onclick="confirmTx('${t.id}','seller')">Je confirme le paiement reçu</button>`;
 }
 if(t.status==='done'){ act=`<div class="info">✅ Terminée — commission ${fmt(t.commission)} FCFA.</div>`;
   if(isBuyer && !reviewedTx(t.id)) act+=`<button class="btn gold sm" style="margin-top:6px" onclick="reviewSellerSheet('${t.id}')">⭐ Noter le vendeur & laisser un avis</button>`;
   else if(isBuyer && reviewedTx(t.id)) act+=`<div class="muted" style="margin-top:6px;font-size:11px">⭐ Tu as déjà noté ce vendeur. Merci !</div>`;
   else if(isSeller && !reviewedTx(t.id)) act+=`<button class="btn ghost sm" style="margin-top:6px" onclick="reviewBuyerSheet('${t.id}')">⭐ Noter l'acheteur</button>`;
   else if(isSeller && reviewedTx(t.id)) act+=`<div class="muted" style="margin-top:6px;font-size:11px">⭐ Tu as déjà noté cet acheteur. Merci !</div>`; }

 if(t.status==='dispute')act=`<div class="warn">⚠️ Litige — l'admin va arbitrer.</div>`;
 return `<div class="box" style="border-left:4px solid var(--grn)"><div class="row"><b class="grow">${esc(t.itemTitle)}</b><span class="muted">${fmt(t.price)} FCFA</span></div>
  <div class="muted">${isBuyer?'Tu es acheteur':'Tu es vendeur'} · ${t.mode==='hand'?'🤝 main propre':'📦 livraison'}</div>${h}${act}</div>`;}
async function confirmTx(id,who){let ref=db.collection('transactions').doc(id);let d=await ref.get();let t=d.data();
 if(who==='buyer')t.validBuyer=true;else t.validSeller=true;
 if(t.validBuyer&&t.validSeller)t.status='done';
 await ref.update({validBuyer:t.validBuyer,validSeller:t.validSeller,status:t.status,updatedAt:Date.now()});
 closeAll();if(t.status==='done'){toast('🎉 Transaction terminée !');}else{toast('Validation enregistrée ✅');}
 if(view==='sell'||view==='home') shell();
 view='sell';shell();}

/* ============== AVIS & NOTATION VENDEUR (après achat) ============== */
// L'acheteur note le vendeur + commentaire une fois la transaction clôturée.
// Stocké dans la collection `reviews` (règle : create par l'auteur, lecture publique).
let myReviews=[], myRevTx=new Set();
function listenReviews(){ auth.onAuthStateChanged(u=>{ if(u){
  db.collection('reviews').where('authorId','==',u.uid).onSnapshot(s=>{
    myReviews=s.docs.map(d=>{const x=d.data();x.id=d.id;return x;});
    myRevTx=new Set(myReviews.filter(r=>r.kind!=='food'&&r.txId).map(r=>r.txId));
    if(!chatIsOpen()&&view==='sell')shell(); }, ()=>{});
} else { myReviews=[]; myRevTx=new Set(); } }); }
function reviewedTx(txId){ return myRevTx.has(txId); }
async function sellerReviews(sid){ try{ const s=await db.collection('reviews').where('sellerId','==',sid).get(); return s.docs.map(d=>{const x=d.data();x.id=d.id;return x;}); }catch(e){ return []; } }
function avgRating(revs){ if(!revs||!revs.length) return null; return (revs.reduce((a,r)=>a+(r.rating||0),0)/revs.length).toFixed(1); }
function starRow(n){ return '⭐'.repeat(Math.max(0,Math.min(5,n)))+'☆'.repeat(Math.max(0,5-n)); }
function reviewSellerSheet(txId){ if(!curProfile) return openAuth();
  const tx=(txCache||[]).find(x=>x.id===txId); if(!tx) return toast('Transaction introuvable');
  if(tx.buyerId!==curProfile.uid) return toast('Seul l\'acheteur peut noter ce vendeur');
  window._revSide='seller'; window._revSide='seller'; window._rateStars=5; window._revTxId=txId;
  openSheet(`<div class="row" style="justify-content:space-between;padding:12px 0"><h2 style="margin:0;font-size:18px">⭐ Noter ${esc(tx.sellerName)}</h2><span style="cursor:pointer;font-size:20px" onclick="closeAll()">✕</span></div>
   <div class="muted" style="margin:2px 0 6px">Après « ${esc(tx.itemTitle)} » · ${fmt(tx.price)} FCFA</div>
   <label>Ta note</label>
   <div id="rev_stars" style="font-size:34px;letter-spacing:2px;margin:6px 0 2px">${[1,2,3,4,5].map(i=>`<span style="cursor:pointer" onclick="setRate(${i})">${i<=5?'⭐':'☆'}</span>`).join('')}</div>
   <div class="muted" style="font-size:11px">1 = très mauvaise expérience · 5 = excellent vendeur</div>
   <label style="margin-top:10px">Commentaire (optionnel)</label><textarea id="rev_c" class="input" rows="3" placeholder="Remise rapide, article conforme, vendeur honnête…"></textarea>
   <button class="btn g" onclick="reviewSubmit()">Publier mon avis</button>`); }
function setRate(n){ window._rateStars=n; const el=document.getElementById('rev_stars'); if(el) el.innerHTML=[1,2,3,4,5].map(i=>`<span style="cursor:pointer" onclick="setRate(${i})">${i<=n?'⭐':'☆'}</span>`).join(''); }
// Avis RÉCIPROQUE : le vendeur peut aussi noter l'acheteur après une transaction clôturée.
function reviewBuyerSheet(txId){ if(!curProfile) return openAuth();
  const tx=(txCache||[]).find(x=>x.id===txId); if(!tx) return toast('Transaction introuvable');
  if(tx.sellerId!==curProfile.uid) return toast('Seul le vendeur peut noter cet acheteur');
  window._revSide='buyer'; window._rateStars=5; window._revTxId=txId;
  openSheet(`<div class="row" style="justify-content:space-between;padding:12px 0"><h2 style="margin:0;font-size:18px">⭐ Noter ${esc(tx.buyerName)} (acheteur)</h2><span style="cursor:pointer;font-size:20px" onclick="closeAll()">✕</span></div>
   <div class="muted" style="margin:2px 0 6px">Après « ${esc(tx.itemTitle)} » · ${fmt(tx.price)} FCFA</div>
   <label>Ta note</label>
   <div id="rev_stars" style="font-size:34px;letter-spacing:2px;margin:6px 0 2px">${[1,2,3,4,5].map(i=>`<span style="cursor:pointer" onclick="setRate(${i})">⭐</span>`).join('')}</div>
   <div class="muted" style="font-size:11px">1 = très mauvaise expérience · 5 = excellent acheteur</div>
   <label style="margin-top:10px">Commentaire (optionnel)</label><textarea id="rev_c" class="input" rows="3" placeholder="Paiement rapide, remise ponctuelle, sérieux…"></textarea>
   <button class="btn g" onclick="reviewSubmit()">Publier mon avis</button>`); }
async function reviewSubmit(){ if(!curProfile) return; const txId=window._revTxId; if(!txId) return;
  const tx=(txCache||[]).find(x=>x.id===txId); if(!tx) return toast('Transaction introuvable');
  const rating=window._rateStars||5; const comment=(val('rev_c')||'').trim(); const side=window._revSide==='buyer'?'buyer':'seller';
  const isSellerRev = side==='seller';
  try{
    await db.collection('reviews').add(isSellerRev
      ? {kind:'seller',txId:tx.id,sellerId:tx.sellerId,sellerName:tx.sellerName,authorId:curProfile.uid,authorName:curProfile.name,rating,comment,createdAt:Date.now()}
      : {kind:'buyer',txId:tx.id,buyerId:tx.buyerId,buyerName:tx.buyerName,authorId:curProfile.uid,authorName:curProfile.name,rating,comment,createdAt:Date.now()});
    myRevTx.add(tx.id); closeAll(); toast('⭐ Merci, ton avis est publié !'); view='sell';shell();
  }catch(e){ console.error('REVIEW',e&&e.code,e&&e.message); toast('❌ '+(e&&e.message||'erreur')); } }

// Enregistre / met à jour mon numéro WhatsApp (champ `wa` du profil).
async function saveWa(){ if(!curProfile)return; const v=document.getElementById('profWa').value.replace(/[^0-9+ ]/g,'').trim();
  if(v && v.replace(/[^0-9]/g,'').length<7) return toast('Numéro invalide');
  try{ await db.collection('users').doc(curProfile.uid).update({wa:v}); }
  catch(e){ return toast('❌ '+e.message); }
  curProfile={...curProfile,wa:v}; toast(v?'✅ WhatsApp enregistré':'WhatsApp retiré'); view='me';shell(); }
// Affiche le bouton « Contacter sur WhatsApp » quand le vendeur a un numéro.
async function loadDetWa(sid){ try{ const seller=await getSeller(sid);
  const ph=(seller&&(seller.wa||seller.phone))||''; const el=document.getElementById('detWa'); if(!el)return;
  const clean=String(ph).replace(/[^0-9]/g,''); if(clean.length<8){ el.style.display='none'; return; }
  el.style.display=''; el.href='https://wa.me/'+clean+'?text='+encodeURIComponent('Bonjour, je vous contacte via Hametkro au sujet de votre annonce. Est-elle toujours disponible ?'); }catch(e){} }
async function logout(){try{await auth.signOut();}catch(_){}stopPresence();view='home';shell();}
function adminTab(id,ic,label){return `<div style="flex:1;text-align:center;padding:9px 2px;cursor:pointer;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap;${_admTab===id?'background:#fff;color:var(--grn);box-shadow:0 3px 10px -6px rgba(0,0,0,.3)':'color:rgba(255,255,255,.85)'}" onclick="_admTab='${id}';shell()">${ic}<br><span style="font-size:9.5px">${label}</span></div>`;}
function adminPanelWrap(headHtml,bodyHtml){return `<div style="background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;box-shadow:var(--sh-s)"><div class="row" style="justify-content:space-between;margin-bottom:8px">${headHtml}</div>${bodyHtml}</div>`;}
function adminV(){ if(!isAdmin())return profileV();
  if(admUsers===null||admTx===null) return `<div class="hdr"><h2>Admin 📊</h2></div><div class="load"><div style="font-size:42px">📊</div>Chargement du tableau de bord…</div>`;
  const users=admUsers||[], tx=admTx||[], now=Date.now(), day=864e5;
  const convs=admConvs||[], menus=admMenus||[], orders=admOrders||[];
  const accounts=users.length;
  const new7=users.filter(u=>u.created&&(now-u.created)<7*day).length;
  const new30=users.filter(u=>u.created&&(now-u.created)<30*day).length;
  const active=(allListings||[]).filter(l=>!l.sold).length;
  const canti=users.filter(u=>u.food&&u.food.name&&!u.food._del).length;
  const done=tx.filter(t=>t.status==='done');
  const rev=done.reduce((a,t)=>a+(t.commission||0),0);
  const disp=tx.filter(t=>t.status==='dispute');
  const msgCount=convs.reduce((a,c)=>a+((c.msgs||[]).length),0);
  const todayOrder=orders.filter(o=>o.date===todayISO()).length;
  const sold=(allListings||[]).filter(l=>l.sold).length;
  const buyers=new Set(tx.map(t=>t.buyerId)).size;

  const kpi=(ic,val,lab,col)=>`<div style="background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--sh-s)"><div style="display:flex;align-items:center;gap:9px"><div style="width:38px;height:38px;border-radius:12px;background:var(${col});display:flex;align-items:center;justify-content:center;font-size:19px;flex:none">${ic}</div><div style="min-width:0"><div style="font-size:20px;font-weight:800;line-height:1;letter-spacing:-.5px">${val}</div><div style="font-size:10px;color:var(--grey);font-weight:600">${lab}</div></div></div></div>`;

  // ================== CONTENU PAR ONGLET ==================
  let content='';
  if(_admTab==='overview'){
    // historigramme 14 jours
    let hist=[]; for(let i=13;i>=0;i--){const ds=now-(i+1)*day,de=now-i*day; hist.push({d:new Date(de).getDate()+'/'+(new Date(de).getMonth()+1),n:users.filter(u=>u.created&&u.created>=ds&&u.created<de).length});}
    const hmax=Math.max(1,...hist.map(x=>x.n));
    const bars=hist.map(x=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:92px;gap:3px"><span style="font-size:9px;font-weight:800;color:var(--grn)">${x.n}</span><div title="${x.n} compte(s)" style="width:70%;max-width:15px;height:${Math.max(3,Math.round(x.n/hmax*66))}px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#129452,#0E7A44);opacity:${x.n?1:.35}"></div><span style="font-size:8px;color:var(--grey2)">${x.d}</span></div>`).join('');
    // repartition catégories
    const catCount={}; (allListings||[]).forEach(l=>{const c=catOf(l.cat).n;catCount[c]=(catCount[c]||0)+1;});
    const catMax=Math.max(1,...Object.values(catCount));
    const catRows=Object.entries(catCount).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>`<div style="margin:5px 0"><div class="row"><span style="font-size:12px" class="grow">${esc(k)}</span><b style="font-size:12px">${v}</b></div><div style="height:7px;background:var(--line);border-radius:6px;margin-top:3px"><div style="height:7px;border-radius:6px;width:${Math.round(v/catMax*100)}%;background:linear-gradient(90deg,#FB8B24,#F07A1E)"></div></div></div>`).join('');
    // derniers comptes
    const recent=users.slice().sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,5);
    const recentRows=recent.map(u=>{const d=new Date(u.created||now);const isF=u.food&&u.food.name;return `<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><div class="av" style="width:34px;height:34px;font-size:16px;flex:none;background:linear-gradient(160deg,${u.role==='admin'?'#FBEEDC,#FBEEDC':'#E3F3E9,#FBEEDC'})">${u.role==='admin'?'👑':(isF?'🍲':'👤')}</div><div class="grow" style="min-width:0"><b style="font-size:12.5px">${esc(u.name||'?')}</b><div class="muted" style="font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(u.email||'')}</div></div><span class="muted" style="font-size:10px">${d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</span></div>`;}).join('');
    const litiges=disp.length?`<div class="warn" style="margin-top:10px"><b>⚠️ ${disp.length} litige(s)</b>${disp.map(d=>`<div style="display:flex;align-items:center;gap:8px;margin-top:7px;justify-content:space-between"><span style="font-size:12px">${esc(d.itemTitle)} · ${esc(d.buyerName)} ↔ ${esc(d.sellerName)}</span><button class="btn sm g" onclick="resolve('${d.id}')">Clôturer</button></div>`).join('')}</div>`:'';
    content=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        ${kpi('👥',fmt(accounts),'Comptes','grn-soft')}
        ${kpi('✨',new7,'Nouveaux 7j','org-soft')}
        ${kpi('🛍️',active,'Annonces actives','grn-soft')}
        ${kpi('🍲',canti,'Cantinières','org-soft')}
        ${kpi('💬',convs.length,'Conversations','grn-soft')}
        ${kpi('🗨️',fmt(msgCount),'Messages','org-soft')}
        ${kpi('🤝',done.length,'Ventes clôturées','grn-soft')}
        ${kpi('💰',fmt(rev),'Commission FCFA','org-soft')}
        ${kpi('📦',sold,'Articles vendus','grn-soft')}
        ${kpi('🍽️',orders.length,'Commandes repas','org-soft')}
        ${kpi('👤',buyers,'Acheteurs uniques','grn-soft')}
        ${kpi('🚨',disp.length,'Litiges','sang')}
      </div>${litiges}
      ${adminPanelWrap(`<b style="font-size:14px">📈 Inscriptions · 14 jours</b><span class="muted" style="font-size:10px">${new30}/30j</span>`,`<div style="display:flex;gap:3px;align-items:flex-end">${bars}</div>`)}
      ${adminPanelWrap(`<b style="font-size:14px">🏷️ Annonces / catégorie</b>`,`${catRows||'<p class="muted center">Aucune annonce</p>'}`)}
      ${adminPanelWrap(`<b style="font-size:14px">🕒 Derniers comptes</b><span class="muted" style="font-size:10px;cursor:pointer" onclick="_admTab='accounts';shell()">Tout voir →</span>`,`${recentRows||'<p class="muted center">Aucun compte</p>'}`)}`;
  }
  else if(_admTab==='accounts'){
    const admins=users.filter(u=>u.role==='admin').length, members=users.filter(u=>u.role!=='admin').length, withwa=users.filter(u=>u.wa||u.phone).length;

async function resolve(id){let ref=db.collection('transactions').doc(id);let d=await ref.get();let t=d.data();t.status='done';await ref.update({status:'done',updatedAt:Date.now()});view='admin';shell();toast('Litige clôturé ✅');}
// Admin — traite / rouvre un signalement utilisateur (écritures admin sur `reports`).
async function resolveReport(id, action){
  const d=await db.collection('reports').doc(id).get(); if(!d.exists) return;
  const isDone = d.data().status==='resolved'||d.data().status==='dismissed';
  let up;
  if(action==='resolved') up={status:'resolved',resolvedAt:Date.now(),resolvedBy:curProfile.uid,resolvedByName:curProfile.name};
  else if(isDone) up={status:'open',resolvedAt:null,resolvedBy:null,resolvedByName:null};
  else up={status:'dismissed',resolvedAt:Date.now(),resolvedBy:curProfile.uid,resolvedByName:curProfile.name};
  try{ await db.collection('reports').doc(id).update(up); toast(action==='resolved'?'✅ Signalement marqué traité':isDone?'↩️ Signalement rouvert':'Signalement ignoré'); shell(); }
  catch(e){ toast('❌ '+(e&&e.message||'erreur')); } }

let txCache=[], _deepDone=false;
let admUsers=null, admTx=null, admConvs=[], admMenus=[], admOrders=[], admReports=[], _admTab='overview', _admRoleF='all', _admQ='', _admTxF='all';
// Optimisation lecture (plan gratuit) : le tableau de bord admin écoutait 6
// collections ENTIÈRES (users, transactions, conversations, foodmenus,
// foodorders, reports) en permanence, même hors de la vue admin — très gros
// consommateur de lectures pour le compte admin. Désormais ces abonnements ne
// sont actifs QUE quand la vue 'admin' est ouverte, puis coupés à la sortie.
let _admUnsubs=[], _admSubscribed=false;
function _admUnsubAll(){ (_admUnsubs||[]).forEach(u=>{ try{u()}catch(e){} }); _admUnsubs=[]; _admSubscribed=false; }
function _admSubscribe(){
  if(_admSubscribed) return;
  if(!isAdmin()) return;
  admUsers=null; admTx=null; admConvs=[]; admMenus=[]; admOrders=[]; admReports=[];
  const onlyAdmin=()=>{ if(!chatIsOpen() && view==='admin') shell(); };
  _admSubscribed=true;
  _admUnsubs.push(db.collection('users').onSnapshot(s=>{ admUsers=s.docs.map(d=>d.data()); onlyAdmin(); }));
  _admUnsubs.push(db.collection('transactions').onSnapshot(s=>{ admTx=s.docs.map(d=>d.data()); onlyAdmin(); }));
  _admUnsubs.push(db.collection('conversations').onSnapshot(s=>{ admConvs=s.docs.map(d=>d.data()); onlyAdmin(); }));
  _admUnsubs.push(db.collection('foodmenus').onSnapshot(s=>{ admMenus=s.docs.map(d=>{const x=d.data();x.id=d.id;return x;}); onlyAdmin(); }));
  _admUnsubs.push(db.collection('foodorders').onSnapshot(s=>{ admOrders=s.docs.map(d=>d.data()); onlyAdmin(); }));
  _admUnsubs.push(db.collection('reports').orderBy('createdAt','desc').onSnapshot(s=>{ admReports=s.docs.map(d=>{const x=d.data();x.id=d.id;return x;}); onlyAdmin(); }, e=>{ console.warn('REPORTS_READ', e && e.code, e && e.message); }));
}
// Appelé à chaque shell() : abonne si on entre dans la vue admin, coupe sinon.
function _admEnsure(curView){
  if(curView==='admin') _admSubscribe();
  else if(_admSubscribed) _admUnsubAll();
}

/* ============== REPAS DU JOUR · cantinières ==============
 * Nouveau mode « menu du jour » : des vendeuses (cantinières) publient chaque
 * jour le menu et la zone/créneau de livraison près des entreprises ; les
 * clients commandent avant l'heure limite et paient à la livraison.
 * DONNÉES :
 *  - users/{uid}.food             : profil cantinière persistant
 *  - foodmenus/{sellerId_DATE}    : menu du jour (lecture publique)
 *  - foodorders/{id}              : commande (réservée aux 2 parties)
 */
let foodToday = [], incOrders = [], myOrders = [];
const FOOD_CUTS = ['08:30','09:00','09:30','10:00','10:30','11:00','11:30'];
const FOOD_WINS = ['11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00'];
function pad2(n){ return (n<10?'0':'')+n; }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function hmMin(h){ const p=String(h==null?'':h).split(':'); return p.length===2? ((+p[0])*60+(+p[1])) : 0; }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function minHm(m){ if(m==null||isNaN(m)) return '—'; return pad2(Math.floor(m/60))+':'+pad2(((m%60)+60)%60); }
function fmtFCFA(n){ return Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function menuOpen(m){ return !!(m && m.date===todayISO() && (m.cutoff||0) > nowMin()); }
function shopOf(){ return (curProfile && curProfile.food) ? curProfile.food : null; }

  auth.onAuthStateChanged(u=>{

      if(!chatIsOpen() && view==='resto') shell();

function parseItems(txt){ const out=[]; (txt||'').split('\n').forEach(line=>{
    const parts=line.split('|'); if(parts.length<2) return;
    const name=parts[0].trim(); const price=parseInt((parts[1]||'').replace(/[^\d]/g,''),10);
    if(name && price>0) out.push({name,price});
  }); return out; }
function parseLines(txt){ const seen=new Set(); (txt||'').split('\n').forEach(l=>{ const s=(l||'').trim(); if(s && !seen.has(s)){ seen.add(s); } }); return [...seen]; }
// Regroupe les commandes reçues par point de livraison (entreprise).
function groupIncoming(orders){ const map={};
  orders.forEach(o=>{ const k=(o.place&&o.place.trim())||''; (map[k]=map[k]||[]).push(o); });
  return Object.keys(map).map(place=>{ const os=map[place];
    return {place, orders:os,
      total: os.reduce((a,o)=>a+(o.total||0),0),
      deliverable: os.filter(o=>o.status==='confirmed').length}; });
}

async function foodSave(){ const n=(val('ff_name')||'').trim(), z=(val('ff_zone')||'').trim();
  if(n.length<2) return toast('Nom requis'); if(z.length<2) return toast('Zone requise');
  const cut=hmMin(val('ff_cut')), ws=hmMin(val('ff_ws')), we=hmMin(val('ff_we'));
  const points=parseLines(val('ff_points'));
  const items=parseItems(val('ff_items'));
  if(!items.length) return toast('Ajoute au moins un plat (Nom | prix)');
  try{
    const food={name:n,zone:z,cutoff:cut,winS:ws,winE:we,points};
    await db.collection('users').doc(curProfile.uid).set({food},{merge:true});
    const date=todayISO(); const did=curProfile.uid+'_'+date;
    await db.collection('foodmenus').doc(did).set({id:did,sellerId:curProfile.uid,sellerName:n,zone:z,
      points,date,cutoff:cut,winS:ws,winE:we,items,time:Date.now()});
    await refreshMe(); // recharge le profil (food) pour afficher le panneau cantinière
    closeAll(); toast('🎉 Menu du jour publié !'); shell();
  }catch(e){ console.error('FOOD_SAVE', e&&e.code, e&&e.message); toast('❌ '+(e&&e.message||'enregistrement impossible')); }
}

// --- Favori cantinière (⭐) : mémorisé par appareil/uid pour épingler sa cantinière ---
function foodFavKey(){ return 'ham_foodfav_'+(curProfile?curProfile.uid:'anon'); }
function foodFavs(){ try{ return JSON.parse(localStorage.getItem(foodFavKey())||'[]'); }catch(e){ return []; } }
function foodIsFav(sid){ return foodFavs().includes(sid); }
function toggleFoodFav(sid){ if(!curProfile) return openAuth();
  let arr=foodFavs(); const i=arr.indexOf(sid); if(i>=0)arr.splice(i,1); else arr.push(sid);
  localStorage.setItem(foodFavKey(),JSON.stringify(arr)); toast(foodIsFav(sid)?'⭐ Cantinière favorite enregistrée':'Retiré des favoris'); shell(); }
// "Recommander les mêmes plats" : re-commande un plat déjà pris aujourd'hui chez la même cantinière.
function canReorder(o){ if(!o) return false; const m=foodToday.find(x=>x.sellerId===o.sellerId); if(!m||!menuOpen(m)) return false;
  const names=(o.items||[]).map(x=>x.name);
  return names.length>0 && names.every(n=>m.items.some(it=>it.name===n)); }
async function recommendOrder(id){ const o=(myOrders||[]).find(x=>x.id===id); if(!o)return toast('Commande introuvable');
  const m=foodToday.find(x=>x.sellerId===o.sellerId); if(!m)return toast('Menu indisponible pour l\'instant');
  const items=(o.items||[]).map(x=>({name:x.name,price:x.price,qty:x.qty})).filter(x=>x.qty>0);
  if(!items.length) return toast('Rien à recommander');
  const total=items.reduce((a,x)=>a+x.price*x.qty,0); const now=Date.now();
  try{
    const doc=db.collection('foodorders').doc();
    await doc.set({id:doc.id,menuId:m.id,date:m.date,sellerId:m.sellerId,sellerName:m.sellerName,
      buyerId:curProfile.uid,buyerName:curProfile.name,items,total,place:o.place||'',note:o.note||'',
      status:'placed',winS:m.winS,winE:m.winE,time:now,updatedAt:now,reorderedFrom:o.id});
    closeAll(); toast('✅ Recommandée ! Paie à la livraison.'); view='resto'; shell();
  }catch(e){ console.error('FOOD_REORDER',e&&e.code,e&&e.message); toast('❌ '+(e&&e.message||'erreur')); } }
function reorderBtn(o){ if(!o) return ''; if(o.sellerId===(curProfile&&curProfile.uid)) return ''; // pas pour la cantinière
  if(!canReorder(o)) return '';
  return `<button class="btn ghost sm" style="margin-top:6px" onclick="recommendOrder('${o.id}')">🔄 Recommander les mêmes plats</button>`; }
// --- Messages : signaler les conversations qui attendent ta réponse / sans réponse ---
function lastMsg(c){ return (c&&c.msgs&&c.msgs.length)?c.msgs[c.msgs.length-1]:null; }
function awaitingMine(c){ const l=lastMsg(c); return curProfile&&l&&l.uid===curProfile.uid; }
function awaitingLabel(c){ const l=lastMsg(c); if(!curProfile||!l) return '';
  if(l.uid===curProfile.uid){ const age=Date.now()-l.time;
    if(age>2*3600*1000) return `<span style="font-size:10px;color:var(--org);font-weight:700">🕓 En attente de réponse · ${timeago(l.time)}</span>`;
    return `<span class="muted" style="font-size:10px">Vous · il y a ${timeago(l.time)}</span>`; }
  return `<span class="muted" style="font-size:10px">${esc(l.name||'')} · ${timeago(l.time)}</span>`; }
function pendingConvs(){ if(!curProfile) return []; return convCache.filter(c=>{ const l=lastMsg(c); return l&&l.uid===curProfile.uid && (Date.now()-l.time)>2*3600*1000; }); }
function needsReplyHtml(){ const pend=pendingConvs(); if(!pend.length) return '';
  const rows=pend.slice(0,4).map(c=>{ const o=otherName(c); return `<div class="listItem" style="padding:10px" onclick="openConv('${c.id}')"><div class="av" style="width:38px;height:38px;font-size:18px">⏰</div><div class="grow"><b style="font-size:13px">${esc(o?o.name:'?')}</b><div class="muted" style="font-size:11px">« ${esc(c.itemTitle||'')} » · pas de réponse depuis ${timeago(c.lastAt)}</div></div><span class="muted">→</span></div>`; }).join('');
  return `<div style="background:var(--org-soft);border:1px solid #FBDDBE;border-radius:14px;padding:10px 12px;margin:8px 12px">
    <b style="font-size:13px">🔔 À relancer (${pend.length})</b>
    <p class="muted" style="margin:2px 0 6px;font-size:11px">Tes derniers messages n'ont pas encore de réponse.</p>${rows}</div>`; }
function openReminder(cid){ openConv(cid); }
// --- Vendeur : demandes en attente + revenus (bloc "à faire") dans Vendre ---
function sellerActionChip(){ if(!curProfile) return '';
  const mine=txCache.filter(t=>t.sellerId===curProfile.uid);
  const toConfirm=mine.filter(t=>t.status!=='done'&&t.status!=='dispute'&&(!t.validSeller||!t.validBuyer)).length;
  const requests=mine.filter(t=>t.status==='agreed'&&!t.validBuyer).length;
  const rev=mine.filter(t=>t.status==='done').reduce((a,t)=>a+(t.price||0),0);
  let parts=[];
  if(toConfirm) parts.push(`<span style="font-size:10px;color:var(--org);font-weight:800">🔔 ${toConfirm} validation(s) en attente</span>`);
  if(requests) parts.push(`<span style="font-size:10px;color:var(--grn);font-weight:700">🛒 ${requests} demande(s) d'achat</span>`);
  if(rev>0) parts.push(`<span style="font-size:10px;font-weight:700">💰 ${fmt(rev)} FCFA vendus (clôturées)</span>`);
  return parts.length?`<div style="padding:4px 12px"><div class="box" style="background:var(--grn-soft);border-left:4px solid var(--grn);padding:10px 12px"><b style="font-size:13px">📊 Ton activité</b>${parts.map(p=>'<div style="margin-top:3px">'+p+'</div>').join('')}<button class="btn g sm" style="margin-top:8px" onclick="view='msg';shell()">Voir mes messages</button></div></div>`:''; }

/* ============== INSTALLATION PWA ============== */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;});
async function installPWA(){ if(!deferredPrompt)return; deferredPrompt.prompt(); const c=await deferredPrompt.userChoice; deferredPrompt=null; toast('Merci ! Hametkro est installé 📲'); }

/* ============== DÉMARRAGE ============== */
try{ fb(); listenListings(); listenTx(); listenConvs(); listenFood(); listenAdmin(); listenFavs(); listenAlerts(); listenReviews(); }catch(e){ renderApp(`<div class="load"><div style="font-size:46px">⚠️</div><div>Erreur d'initialisation Firebase.</div><div class="muted">Ouvre cette page via le serveur (http), pas en fichier local, et vérifie firebase-config.js.</div></div>`);}
</script>
