name: hametkro
description: "Hametkro — Marché de seconde main. Achetez, vendez, donnez une seconde vie (Côte d'Ivoire & Afrique)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (backend)
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.0

  # État & navigation
  provider: ^6.1.1
  go_router: ^13.2.0

  # UI / utilitaires
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  uuid: ^4.2.2
  shimmer: ^3.0.0
  carousel_slider: ^4.2.1
  url_launcher: ^6.2.2
  geolocator: ^11.0.0
  country_picker: ^2.0.23
  share_plus: ^7.2.2
  photo_view: ^0.15.0
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
